name: Security Scanning
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans weekly on Mondays at 8:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Python dependency vulnerability scanning
  dependency-audit:
    permissions:
      contents: read
    name: Python Dependency Audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      # PYSEC-2025-183: disputed PyJWT advisory (HMAC key length is chosen by the
      # app). We pin pyjwt 2.12.1 (latest); Cognito JWT paths use RS256 via JWKS.
      # 22 Nov 2026: ignore-vulns is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when one is ignored.
      - name: Audit Python requirements
        uses: lx-software-ltd/actions/pip-audit@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          requirements: backend/requirements.txt
          ignore-vulns: PYSEC-2025-183

  # Python security linting with Bandit
  bandit:
    permissions:
      contents: read
    name: Bandit Security Linter
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      # Measured 22 Nov 2026 on backend/src and backend/lambda. No high
      # findings. Two B310 urlopen calls are marked on the line:
      # cfn_response.py validates HTTPS and an amazonaws.com host, and
      # aws_proxy.py allows only http or https URLs on its allow-list.
      # B105 and B106 do not match.
      - name: Run Bandit
        uses: lx-software-ltd/actions/bandit@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          paths: src lambda
          root: backend

  # Infrastructure as Code scanning with Checkov
  checkov:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Acknowledge CDK CLI notice
        working-directory: backend/infrastructure
        run: npx cdk acknowledge 34892 || true

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
        run: npx cdk synth --quiet --output cdk.out

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml

  # Python stays /language:python. javascript-typescript is a new
  # configuration, not a rename of the Python category.
  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            category: "/language:python"
          - language: javascript-typescript
            category: "/language:javascript-typescript"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          category: ${{ matrix.category }}

  pii-denylist:
    permissions:
      contents: read
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24

  # Secret scanning (in addition to GitHub's built-in scanning)
  secrets-scan:
    permissions:
      contents: read
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The shared action downloads the MIT-licensed CLI. fetch-depth 0
      # stays so the scan still covers history. Dependabot pull requests
      # do not need a Gitleaks license.
      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24

  npm-audit:
    permissions:
      contents: read
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24

      # 22 Nov 2026: audit-level is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when the level changes.
      - name: Audit npm lockfiles
        uses: lx-software-ltd/actions/npm-audit@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          directories: |
            apps/admin_web
            apps/public_www
            packages/react_ui
            packages/api_client_ts
            backend/infrastructure
          audit-level: high

  # Summary job
  # Semgrep OSS lives in .github/workflows/semgrep.yml so GitHub Code
  # Scanning can discover the canonical Semgrep OSS configuration.
  security-summary:
    permissions:
      contents: read
    name: security-summary
    runs-on: ubuntu-26.04
    needs: [checkov, codeql, pii-denylist, secrets-scan, dependency-audit, bandit, npm-audit]
    if: always()
    steps:
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@67d19fe22da0c68541b24034c56d52d25fe9c420 # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
