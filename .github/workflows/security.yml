name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans weekly on Mondays at 8:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Python dependency vulnerability scanning
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        # PYSEC-2025-183: disputed PyJWT advisory (HMAC key length is chosen by the
        # app). We pin pyjwt 2.12.1 (latest); Cognito JWT paths use RS256 via JWKS.
        run: |
          pip-audit -r requirements.txt --desc on --format json \
            --output audit-results.json \
            --ignore-vuln PYSEC-2025-183 || true
          pip-audit -r requirements.txt --desc on --ignore-vuln PYSEC-2025-183

      - name: Upload audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pip-audit-results
          path: backend/audit-results.json
          retention-days: 30

  # Python security linting with Bandit
  bandit:
    name: Bandit Security Linter
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Bandit
        run: python -m pip install bandit[toml]

      - name: Run Bandit
        working-directory: backend
        # Rule skips (centralized suppressions):
        # - B310 (urllib_urlopen): Suppressed because cfn_response.py validates URLs
        #   before use (HTTPS only, .amazonaws.com hosts only), preventing the
        #   file:// scheme attack vector. See src/app/utils/cfn_response.py
        run: |
          bandit -r src lambda -f json -o bandit-results.json --skip B310 || true
          bandit -r src lambda -f txt --skip B310

      - name: Upload Bandit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-results
          path: backend/bandit-results.json
          retention-days: 30

  # Infrastructure as Code scanning with Checkov
  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "26"
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Acknowledge CDK CLI notice
        working-directory: backend/infrastructure
        run: npx cdk acknowledge 34892 || true

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
        run: npx cdk synth --quiet --output cdk.out

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml
          framework: cloudformation

  # Python stays /language:python. javascript-typescript is a new
  # configuration, not a rename of the Python category.
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            category: "/language:python"
          - language: javascript-typescript
            category: "/language:javascript-typescript"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          category: ${{ matrix.category }}

  pii-denylist:
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22

      - name: Test PII check normalization
        run: python3 -m unittest scripts/test_check_pii.py -v

  # Secret scanning (in addition to GitHub's built-in scanning)
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The shared action downloads the MIT-licensed CLI. fetch-depth 0
      # stays so the scan still covers history. Dependabot pull requests
      # do not need a Gitleaks license.
      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22

  # Summary job
  # Semgrep OSS lives in .github/workflows/semgrep.yml so GitHub Code
  # Scanning can discover the canonical Semgrep OSS configuration.
  security-summary:
    name: Security Summary
    runs-on: ubuntu-26.04
    needs: [dependency-audit, bandit, checkov, codeql, pii-denylist, secrets-scan]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov | ${{ needs.checkov.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PII denylist | ${{ needs.pii-denylist.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | see Semgrep workflow |" >> $GITHUB_STEP_SUMMARY
