# Canonical Semgrep OSS workflow path. GitHub Code Scanning's Semgrep OSS
# setup looks for this file; keeping the job only inside security.yml left
# the tool-status page at "1 configuration not found".
# https://semgrep.dev/docs/semgrep-ci/sample-ci-configs
name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Align with Security Scanning (Mondays at 8:00 UTC)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep@sha256:f83a64e8a7d985eaa51ee3978c9c882be946964c68633fba5d2817cf297a3912 # 2026-11-17
    # Dependabot PRs do not have security-events write on the default token
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cfn_response.py marks its reviewed urlopen with nosemgrep. The urllib
      # rule is not excluded for the rest of the repository.
      # gha-curl-pipe-shell stays excluded. The rule parses `run:` blocks as
      # Bash and emits SARIF toolExecutionNotifications (level: warning) on
      # GitHub `${{ }}` expressions. GitHub's Security tool-status page then
      # reports "Semgrep OSS is reporting warnings".
      # mode scan reads the whole repository. This file was already scan,
      # not semgrep ci. The added pack is p/javascript.
      - name: Run Semgrep
        uses: lx-software-ltd/actions/semgrep@9235676200771b2f93bc01ac85f3de1392133182 # main 2026-11-22
        with:
          mode: scan
          rules: p/python p/javascript p/security-audit p/secrets p/owasp-top-ten
          exclude-rules: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
          upload: "false"

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
