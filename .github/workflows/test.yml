name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "backend/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "backend/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/test.yml"

jobs:
  pii-denylist:
    name: PII denylist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        run: python3 scripts/check_pii.py

      - name: Test PII check normalization
        run: python3 -m unittest scripts/test_check_pii.py -v

  test-flutter:
    name: Test Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Install system SQLite for Linux native assets
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      # sqlite3 3.1.7 (Amplify secure storage) downloads a GitHub release
      # whose Linux binary hash no longer matches the package, so
      # `flutter test` dies in the native-assets hook. 3.1.7 cannot set
      # source per OS, so Linux CI uses the system library; iOS and
      # Android still use the bundled build from pubspec.yaml.
      - name: Point Linux sqlite3 hook at the OS library
        run: |
          python3 -c '
          from pathlib import Path
          path = Path("apps/siutindei_app/pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          hook = (
              "\nhooks:\n"
              "  user_defines:\n"
              "    sqlite3:\n"
              "      source: system\n"
          )
          if "user_defines:" not in text:
              path.write_text(text + hook, encoding="utf-8")
          '

      - name: Run Flutter tests
        run: |
          set -e
          shopt -s globstar nullglob
          for dir in apps/siutindei_app packages/flutter_ui packages/api_client_dart; do
            if [ -f "$dir/pubspec.yaml" ]; then
              test_files=($dir/test/**/*_test.dart)
              if [ "${#test_files[@]}" -eq 0 ]; then
                echo "No Flutter tests found in $dir"
                continue
              fi
              echo "Testing Flutter in $dir"
              (cd "$dir" && flutter pub get && flutter test)
            else
              echo "Skipping missing $dir"
            fi
          done

  test-node:
    name: Test Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run Node tests
        run: |
          set -e
          for dir in apps/admin_web apps/public_www packages/react_ui packages/api_client_ts; do
            if [ -f "$dir/package.json" ]; then
              echo "Testing Node in $dir"
              if [ -f "$dir/package-lock.json" ]; then
                (cd "$dir" && npm ci)
              else
                (cd "$dir" && npm install)
              fi
              (cd "$dir" && npm run test --if-present)
            else
              echo "Skipping missing $dir"
            fi
          done

  test-public-www-e2e:
    name: Test Public Website E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/public_www
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Sync staging search fixture
        working-directory: .
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh public-www

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/public_www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: public-www-test-results
          path: apps/public_www/test-results/
          retention-days: 7

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          # Full history so agent-rule [why:] SHAs resolve.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "backend/dev-requirements.txt" ]; then
            python -m pip install -r backend/dev-requirements.txt
          else
            python -m pip install -r backend/requirements.txt
            python -m pip install 'pytest>=8.0' 'pytest-cov>=5.0'
          fi

      - name: Apply database migrations
        run: python -m alembic -c backend/db/alembic.ini upgrade head

      - name: Run Python tests
        run: |
          shopt -s globstar nullglob
          tests=(tests/test_*.py tests/**/*.py backend/**/test_*.py backend/**/tests/*.py backend/**/tests/**/*.py)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No Python tests found"
            exit 0
          fi
          python -m pytest tests backend --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=35

  test-infrastructure:
    name: Test Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install infrastructure dependencies
        run: |
          if [ -f "backend/infrastructure/package.json" ]; then
            cd backend/infrastructure
            npm ci
          else
            echo "Missing backend/infrastructure/package.json"
          fi

      - name: Run infrastructure tests
        run: |
          if [ -f "backend/infrastructure/package.json" ]; then
            cd backend/infrastructure
            npm run test:infra
          else
            echo "Missing backend/infrastructure/package.json"
          fi

      - name: Run edge function and Cloudflare Worker tests
        run: node --test backend/infrastructure/test/*.test.mjs scripts/cloudflare/workers/*.test.mjs
