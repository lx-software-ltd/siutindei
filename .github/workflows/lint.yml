name: Lint
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    # No path filter. The gate job is a required check, and a skipped
    # required check leaves the pull request blocked.
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "backend/**"
      - "tests/**"
      - "scripts/**"
      - ".cursor/**"
      - "AGENTS.md"
      - ".cursorrules"
      - "BUGBOT.md"
      - "docs/plans/**"
      - "docs/research/**"
      - "docs/architecture/zones.md"
      - ".github/workflows/lint.yml"

jobs:
  validate-agent-harness:
    name: Validate agent harness
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23

      - name: Install pytest
        run: python -m pip install 'pytest>=8.0'

      - name: Run the shared harness
        uses: lx-software-ltd/actions/agent-harness@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23

      - name: Run the remaining repository checks
        run: |
          set -euo pipefail
          python3 scripts/check_openapi_routes.py
          python3 scripts/check_stack_invariants.py
          node scripts/check-lambda-docs.mjs
          python3 -m pytest tests/test_board_policy.py tests/test_agent_harness_checks.py tests/test_alembic_revision_contract.py -q

  lint-dart:
    name: Lint Dart
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: lx-software-ltd/actions/setup-flutter@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          channel: "stable"
          # pubspec.lock was resolved with this SDK. Floating stable rewrites it.
          flutter-version: "3.50.1"
          cache: "true"

      - name: Run Dart/Flutter lint
        run: |
          set -e
          for dir in apps/siutindei_app packages/flutter_ui packages/api_client_dart; do
            if [ -d "$dir" ]; then
              echo "Linting Dart in $dir"
              (cd "$dir" && flutter pub get && flutter analyze)
            else
              echo "Skipping missing $dir"
            fi
          done

  lint-react:
    name: Lint React
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23

      - name: Run React lint
        run: |
          set -e
          for dir in apps/admin_web apps/public_www packages/react_ui packages/api_client_ts; do
            if [ -f "$dir/package.json" ]; then
              echo "Linting React in $dir"
              if [ -f "$dir/package-lock.json" ]; then
                (cd "$dir" && npm ci)
              else
                (cd "$dir" && npm install)
              fi
              (cd "$dir" && npm run lint --if-present)
              (cd "$dir" && npm run typecheck --if-present)
            else
              echo "Skipping missing $dir"
            fi
          done

      - name: Check OpenAPI generated types are up-to-date
        working-directory: apps/admin_web
        run: |
          npm run generate:api
          if ! git diff --quiet src/types/api-admin.generated.ts; then
            echo "::error::Generated types are out of date. Run 'npm run generate:api' in apps/admin_web and commit the result."
            git diff src/types/api-admin.generated.ts
            exit 1
          fi
          echo "Generated types are up-to-date."

  lint-python:
    name: Lint Python
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          python-version: "3.12"
          requirements: backend/requirements.txt

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  lint-cdk:
    name: Lint CDK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Run CDK lint
        working-directory: backend/infrastructure
        run: npm run lint --if-present

      - name: Synthesize CDK
        working-directory: backend/infrastructure
        run: npx cdk synth --quiet || echo "CDK synth requires parameters, skipping validation"

  lint-openapi:
    name: Lint OpenAPI
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint OpenAPI specs
        run: npx --yes @redocly/cli@1.34.11 lint docs/api/admin.yaml docs/api/partner.yaml docs/api/search.yaml

  workflow-conformance:
    name: Workflow conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflows
        uses: lx-software-ltd/actions/workflow-conformance@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          mode: enforce
          profile: product

  type-check:
    name: Type-check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23

      - name: Type-check Node apps
        run: |
          set -euo pipefail
          for dir in apps/admin_web apps/public_www backend/infrastructure; do
            echo "Type-checking $dir"
            npm ci --prefix "$dir"
            npm run typecheck --prefix "$dir"
          done

  lint:
    name: lint
    runs-on: ubuntu-26.04
    needs:
      - validate-agent-harness
      - lint-dart
      - lint-react
      - lint-python
      - lint-cdk
      - lint-openapi
      - workflow-conformance
      - type-check
    if: always()
    steps:
      - name: Require every lint job
        uses: lx-software-ltd/actions/require-jobs@7d93bef212616595c866a76b03862eb72abbb746 # main 2026-11-23
        with:
          needs-json: ${{ toJson(needs) }}
