name: Promote Public Website Release

on:
  # 04:00 Hong Kong time. Rebuilds the live release with the latest catalogue
  # snapshot; skipped when no activity changed since the last production build.
  schedule:
    - cron: '0 20 * * *'
  repository_dispatch:
    types: [promote-public-www]
  workflow_dispatch:
    inputs:
      promotion_mode:
        description: 'Operation mode'
        required: true
        default: 'latest_staging'
        type: choice
        options:
          - latest_staging
          - release_id
          - refresh_production
          - maintenance_on
      release_id:
        description: 'Required when promotion_mode=release_id'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-public-www
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Resolve public site build config from infrastructure params
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh

      - name: Validate AWS configuration
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ] || [ -z "$AWS_REGION" ]; then
            echo 'AWS_ACCOUNT_ID and AWS_REGION variables are required'
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Resolve release ID
        id: resolve_release
        env:
          PROMOTION_MODE: ${{ github.event_name == 'schedule' && 'refresh_production' || inputs.promotion_mode }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          STACK_NAME: lxsoftware-siutindei-public-www
        run: |
          RESOLVED_PROMOTION_MODE="${PROMOTION_MODE:-latest_staging}"

          if [ "$RESOLVED_PROMOTION_MODE" = "maintenance_on" ]; then
            echo "release_id=" >> "$GITHUB_OUTPUT"
            echo "maintenance_mode=true" >> "$GITHUB_OUTPUT"
            echo "promotion_mode=$RESOLVED_PROMOTION_MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release artifacts and the production markers live in the staging bucket.
          STAGING_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicWwwStagingBucketName'].OutputValue" \
            --output text)"
          if [ -z "$STAGING_BUCKET" ] || [ "$STAGING_BUCKET" = "None" ]; then
            echo 'Staging bucket output not found on Public Website stack'
            exit 1
          fi
          echo "staging_bucket=$STAGING_BUCKET" >> "$GITHUB_OUTPUT"

          if [ "$RESOLVED_PROMOTION_MODE" = "release_id" ]; then
            if [ -z "$INPUT_RELEASE_ID" ]; then
              echo 'release_id is required when promotion_mode=release_id'
              exit 1
            fi
            SELECTED_RELEASE_ID="$INPUT_RELEASE_ID"
          elif [ "$RESOLVED_PROMOTION_MODE" = "refresh_production" ]; then
            RELEASE_MARKER="$(mktemp)"
            BUILD_MARKER="$(mktemp)"
            if ! aws s3 cp --only-show-errors "s3://$STAGING_BUCKET/releases/production-release-id.txt" "$RELEASE_MARKER" \
              || ! aws s3 cp --only-show-errors "s3://$STAGING_BUCKET/releases/production-build-sha.txt" "$BUILD_MARKER"; then
              echo '::notice::No production build is recorded yet. Promote a release once to start daily refreshes.'
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "maintenance_mode=false" >> "$GITHUB_OUTPUT"
              echo "promotion_mode=$RESOLVED_PROMOTION_MODE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SELECTED_RELEASE_ID="$(tr -d '\r\n' < "$RELEASE_MARKER")"
            BUILD_SHA="$(tr -d '\r\n' < "$BUILD_MARKER")"
            rm -f "$RELEASE_MARKER" "$BUILD_MARKER"
            if ! printf '%s' "$BUILD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Production build marker is not a commit SHA: '$BUILD_SHA'"
              exit 1
            fi
            echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$RESOLVED_PROMOTION_MODE" = "latest_staging" ]; then
            MARKER_FILE="$(mktemp)"
            aws s3 cp \
              "s3://$STAGING_BUCKET/releases/latest-release-id.txt" \
              "$MARKER_FILE"
            SELECTED_RELEASE_ID="$(tr -d '\r\n' < "$MARKER_FILE")"
            rm -f "$MARKER_FILE"
            if [ -z "$SELECTED_RELEASE_ID" ]; then
              echo 'Latest staging release marker is empty'
              exit 1
            fi
          else
            echo "Unsupported promotion_mode: $RESOLVED_PROMOTION_MODE"
            exit 1
          fi

          if [ -z "$SELECTED_RELEASE_ID" ]; then
            echo 'Resolved release ID is empty'
            exit 1
          fi
          echo "release_id=$SELECTED_RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "maintenance_mode=false" >> "$GITHUB_OUTPUT"
          echo "promotion_mode=$RESOLVED_PROMOTION_MODE" >> "$GITHUB_OUTPUT"

      # A refresh rebuilds the code that is live, not the tip of the default branch.
      - name: Check out the live production build
        if: ${{ steps.resolve_release.outputs.build_sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_release.outputs.build_sha }}
          lfs: true

      - name: Download catalogue snapshot
        id: catalogue_snapshot
        if: ${{ steps.resolve_release.outputs.maintenance_mode != 'true' && steps.resolve_release.outputs.skip != 'true' }}
        env:
          SNAPSHOT_OUTPUT_PATH: ${{ runner.temp }}/catalogue-snapshot.json
        run: bash scripts/deploy/fetch-public-www-catalogue-snapshot.sh

      - name: Compare catalogue with the live build
        id: catalogue_changes
        if: ${{ steps.resolve_release.outputs.maintenance_mode != 'true' && steps.resolve_release.outputs.skip != 'true' }}
        env:
          PROMOTION_MODE: ${{ steps.resolve_release.outputs.promotion_mode }}
          STAGING_BUCKET: ${{ steps.resolve_release.outputs.staging_bucket }}
          SNAPSHOT_PATH: ${{ steps.catalogue_snapshot.outputs.path }}
        run: |
          CURRENT="$RUNNER_TEMP/catalogue-digests.json"
          PREVIOUS="$RUNNER_TEMP/previous-catalogue-digests.json"
          python3 scripts/deploy/catalogue_snapshot_digests.py "$SNAPSHOT_PATH" "$CURRENT"
          if ! aws s3 cp --only-show-errors "s3://$STAGING_BUCKET/releases/production-catalogue-digests.json" "$PREVIOUS"; then
            rm -f "$PREVIOUS"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$PROMOTION_MODE" = "refresh_production" ] && [ -f "$PREVIOUS" ] && cmp -s "$CURRENT" "$PREVIOUS"; then
            echo '::notice::No activity changed since the live build. Skipping the refresh.'
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/public_www/package-lock.json

      - name: Install public website dependencies
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        run: npm ci
        working-directory: apps/public_www

      - name: Validate search area scope
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        env:
          SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
        run: python3 scripts/deploy/validate_search_area_scope.py

      - name: Verify public website build env contract
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        run: npm run assert:build-env-contract
        working-directory: apps/public_www
        env:
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || steps.resolve_public_site_config.outputs.site_name }}
          NEXT_PUBLIC_STAGING_SEARCH_DATA_ENABLED: 'false'
          NEXT_PUBLIC_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_SEARCH_API_KEY }}
          NEXT_PUBLIC_DEVICE_ATTESTATION_TOKEN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GTM_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_GTM_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}

      - name: Build public website for production
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        run: npm run build
        working-directory: apps/public_www
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || steps.resolve_public_site_config.outputs.site_name }}
          NEXT_PUBLIC_SITE_TAGLINE: ${{ vars.NEXT_PUBLIC_SITE_TAGLINE || steps.resolve_public_site_config.outputs.site_tagline }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL || steps.resolve_public_site_config.outputs.contact_email }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_BUILD_YEAR: ${{ vars.NEXT_PUBLIC_BUILD_YEAR }}
          NEXT_PUBLIC_STAGING_BADGE_ENABLED: 'false'
          NEXT_PUBLIC_STAGING_SEARCH_DATA_ENABLED: 'false'
          NEXT_PUBLIC_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_SEARCH_API_KEY }}
          NEXT_PUBLIC_DEVICE_ATTESTATION_TOKEN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GTM_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_GTM_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
          PUBLIC_WWW_CATALOGUE_SNAPSHOT_PATH: ${{ steps.catalogue_snapshot.outputs.path }}
          PUBLIC_WWW_CATALOGUE_SNAPSHOT_REQUIRED: 'true'

      - name: Write IndexNow key file
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 scripts/deploy/indexnow.py write-key apps/public_www/out

      - name: Promote release or enable maintenance mode
        if: ${{ steps.resolve_release.outputs.maintenance_mode == 'true' || steps.catalogue_changes.outputs.deploy == 'true' }}
        run: bash 'scripts/deploy/deploy-public-www.sh'
        env:
          PUBLIC_WWW_STACK_NAME: lxsoftware-siutindei-public-www
          PUBLIC_WWW_ENVIRONMENT: production
          PUBLIC_WWW_MAINTENANCE_MODE: ${{ steps.resolve_release.outputs.maintenance_mode }}
          PUBLIC_WWW_PROMOTE_RELEASE_ID: ${{ steps.resolve_release.outputs.release_id }}
          PUBLIC_WWW_PROMOTION_BUILD_DIR: ${{ steps.resolve_release.outputs.maintenance_mode != 'true' && format('{0}/apps/public_www/out', github.workspace) || '' }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL || steps.resolve_public_site_config.outputs.contact_email }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_LX_SOFTWARE_URL: ${{ vars.NEXT_PUBLIC_LX_SOFTWARE_URL }}
          NEXT_PUBLIC_BUILD_YEAR: ${{ vars.NEXT_PUBLIC_BUILD_YEAR }}

      # The daily refresh rebuilds this commit and compares against these digests.
      - name: Record the live production build
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        env:
          STAGING_BUCKET: ${{ steps.resolve_release.outputs.staging_bucket }}
          RELEASE_ID: ${{ steps.resolve_release.outputs.release_id }}
          CURRENT_DIGESTS: ${{ steps.catalogue_changes.outputs.current }}
        run: |
          printf '%s\n' "$RELEASE_ID" | aws s3 cp --only-show-errors - "s3://$STAGING_BUCKET/releases/production-release-id.txt"
          git rev-parse HEAD | aws s3 cp --only-show-errors - "s3://$STAGING_BUCKET/releases/production-build-sha.txt"
          aws s3 cp --only-show-errors "$CURRENT_DIGESTS" "s3://$STAGING_BUCKET/releases/production-catalogue-digests.json"

      - name: Notify IndexNow
        if: ${{ steps.catalogue_changes.outputs.deploy == 'true' }}
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
          PROMOTION_MODE: ${{ steps.resolve_release.outputs.promotion_mode }}
          PREVIOUS_DIGESTS: ${{ steps.catalogue_changes.outputs.previous }}
          CURRENT_DIGESTS: ${{ steps.catalogue_changes.outputs.current }}
        run: |
          # A refresh changes catalogue pages only; a promotion can change every page.
          if [ "$PROMOTION_MODE" = "refresh_production" ]; then
            python3 scripts/deploy/indexnow.py ping apps/public_www/out --previous "$PREVIOUS_DIGESTS" --current "$CURRENT_DIGESTS"
          else
            python3 scripts/deploy/indexnow.py ping apps/public_www/out
          fi

      - name: Publish promotion summary
        env:
          PROMOTION_MODE: ${{ steps.resolve_release.outputs.promotion_mode }}
          RELEASE_ID: ${{ steps.resolve_release.outputs.release_id }}
          SKIPPED: ${{ steps.resolve_release.outputs.skip == 'true' || steps.catalogue_changes.outputs.deploy == 'false' }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            {
              echo '## Public Website refresh skipped'
              echo ''
              echo "- Promotion mode: \`${PROMOTION_MODE}\`"
              echo '- Reason: no production build recorded yet, or no activity changed since the live build'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PROMOTION_MODE" = "maintenance_on" ]; then
            {
              echo '## Public Website maintenance mode enabled'
              echo ''
              echo '- Operation mode: `maintenance_on`'
              echo '- Target environment: `production`'
              echo '- Stack: `lxsoftware-siutindei-public-www`'
              echo "- Production URL: \`${{ steps.resolve_public_site_config.outputs.production_site_origin }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Public Website promotion'
              echo ''
              echo "- Promotion mode: \`${PROMOTION_MODE}\`"
              echo "- Release ID: \`${RELEASE_ID}\`"
              echo '- Source environment: `staging`'
              echo '- Target environment: `production`'
              echo '- Build: fresh static export with **production** GitHub Environment variables'
              echo '- Stack: `lxsoftware-siutindei-public-www`'
              echo "- Production URL: \`${{ steps.resolve_public_site_config.outputs.production_site_origin }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
