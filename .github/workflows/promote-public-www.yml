name: Promote Public Website Release

on:
# template:optional catalogue
  # 04:00 Hong Kong time. Rebuilds the live release with the latest catalogue
  # snapshot; skipped when no activity changed since the last production build.
  schedule:
    - cron: '0 20 * * *'
# template:end
  repository_dispatch:
    types: [promote-public-www]
  workflow_dispatch:
    inputs:
      promotion_mode:
        description: 'Operation mode'
        required: true
        default: 'latest_staging'
        type: choice
        options:
# template:set
          - latest_staging
          - release_id
          - refresh_production
          - maintenance_on
# template:end
      release_id:
        description: 'Required when promotion_mode=release_id'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-public-www
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    outputs:
      deploy: ${{ steps.resolve_release.outputs.deploy }}
      maintenance_mode: ${{ steps.resolve_release.outputs.maintenance_mode }}
      skip: ${{ steps.resolve_release.outputs.skip }}
      build_sha: ${{ steps.resolve_release.outputs.build_sha }}
      release_id: ${{ steps.resolve_release.outputs.release_id }}
      promotion_mode: ${{ steps.resolve_release.outputs.promotion_mode }}
      production_site_origin: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
      asset_share_base_url: ${{ steps.resolve_public_site_config.outputs.asset_share_base_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh
        env:
          PROMOTION_MODE: ${{ github.event.inputs.promotion_mode }}

      - name: Validate AWS configuration
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ] || [ -z "$AWS_REGION" ]; then
            echo 'Set AWS_ACCOUNT_ID as a repository secret and AWS_REGION as a variable'
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@7389af585c4c2aad4221704b07ed2936106ff169 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Read staging bucket
        id: staging
        if: ${{ github.event.inputs.promotion_mode == '' || github.event.inputs.promotion_mode == 'latest_staging' }}
        uses: lx-software-ltd/actions/cfn-stack-outputs@7389af585c4c2aad4221704b07ed2936106ff169 # main 2026-11-24
        with:
# template:set
          stack: lxsoftware-siutindei-public-www
# template:end
          outputs: PublicWwwStagingBucketName
          region: ${{ vars.AWS_REGION }}

      - name: Resolve release ID
        id: resolve_release
        env:
          PROMOTION_MODE: ${{ github.event.inputs.promotion_mode }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          STACK_JSON: ${{ steps.staging.outputs.json }}
        run: bash scripts/deploy/resolve-release-id.sh

# template:optional catalogue
      # A refresh rebuilds the code that is live, not the tip of the default branch.
      # The snapshot scripts come from that commit.
      - name: Check out the live production build
        if: ${{ success() && steps.resolve_release.outputs.build_sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_release.outputs.build_sha }}
          lfs: true

      - name: Download catalogue snapshot
        id: catalogue_snapshot
        if: ${{ success() && steps.resolve_release.outputs.maintenance_mode != 'true' && steps.resolve_release.outputs.skip != 'true' }}
        env:
          SNAPSHOT_OUTPUT_PATH: ${{ runner.temp }}/catalogue-snapshot.json
        run: bash scripts/deploy/fetch-public-www-catalogue-snapshot.sh

      - name: Compare catalogue with the live build
        id: catalogue_changes
        if: ${{ success() && steps.resolve_release.outputs.maintenance_mode != 'true' && steps.resolve_release.outputs.skip != 'true' }}
        env:
          PROMOTION_MODE: ${{ steps.resolve_release.outputs.promotion_mode }}
          STAGING_BUCKET: ${{ steps.resolve_release.outputs.staging_bucket }}
          SNAPSHOT_PATH: ${{ steps.catalogue_snapshot.outputs.path }}
        run: |
          CURRENT="$RUNNER_TEMP/catalogue-digests.json"
          PREVIOUS="$RUNNER_TEMP/previous-catalogue-digests.json"
          python3 scripts/deploy/catalogue_snapshot_digests.py "$SNAPSHOT_PATH" "$CURRENT"
          if ! aws s3 cp --only-show-errors "s3://$STAGING_BUCKET/releases/production-catalogue-digests.json" "$PREVIOUS"; then
            rm -f "$PREVIOUS"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$PROMOTION_MODE" = "refresh_production" ] && [ -f "$PREVIOUS" ] && cmp -s "$CURRENT" "$PREVIOUS"; then
            echo '::notice::No activity changed since the live build. Skipping the refresh.'
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack promotion inputs
        if: ${{ success() && steps.catalogue_changes.outputs.deploy == 'true' }}
        env:
          SNAPSHOT_PATH: ${{ steps.catalogue_snapshot.outputs.path }}
          CURRENT_DIGESTS: ${{ steps.catalogue_changes.outputs.current }}
          PREVIOUS_DIGESTS: ${{ steps.catalogue_changes.outputs.previous }}
        run: |
          mkdir -p "$RUNNER_TEMP/promote-inputs"
          cp "$SNAPSHOT_PATH" "$RUNNER_TEMP/promote-inputs/catalogue-snapshot.json"
          cp "$CURRENT_DIGESTS" "$RUNNER_TEMP/promote-inputs/catalogue-digests.json"
          if [ -f "$PREVIOUS_DIGESTS" ]; then
            cp "$PREVIOUS_DIGESTS" "$RUNNER_TEMP/promote-inputs/previous-catalogue-digests.json"
          fi

      - name: Upload promotion inputs
        if: ${{ success() && steps.catalogue_changes.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promote-public-www-inputs
          path: ${{ runner.temp }}/promote-inputs
          if-no-files-found: error
          retention-days: 1
# template:end

  promote:
    permissions:
      contents: read
      id-token: write
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && (needs.prepare.result == 'success') }}
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        if: ${{ needs.prepare.outputs.deploy == 'true' || needs.prepare.outputs.maintenance_mode == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # template:set
          ref: ${{ needs.prepare.outputs.build_sha || github.sha }}
          lfs: true
          # template:end

      # template:optional catalogue
      - name: Download promotion inputs
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: promote-public-www-inputs
          path: ${{ runner.temp }}/promote-inputs

      # template:end

      - name: Set up Node.js
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        uses: lx-software-ltd/actions/setup-node@7389af585c4c2aad4221704b07ed2936106ff169 # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run pre-build checks
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        run: bash scripts/deploy/public-www-checks.sh pre-build

      - name: Build public website for production
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        run: npm run build
        working-directory: apps/public_www
        # template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ needs.prepare.outputs.production_site_origin }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || needs.prepare.outputs.site_name }}
          NEXT_PUBLIC_SITE_TAGLINE: ${{ vars.NEXT_PUBLIC_SITE_TAGLINE || needs.prepare.outputs.site_tagline }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL || needs.prepare.outputs.contact_email }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_BUILD_YEAR: ${{ vars.NEXT_PUBLIC_BUILD_YEAR }}
          NEXT_PUBLIC_STAGING_BADGE_ENABLED: "false"
          NEXT_PUBLIC_STAGING_SEARCH_DATA_ENABLED: "false"
          NEXT_PUBLIC_SEARCH_API_KEY: ${{ secrets.NEXT_PUBLIC_SEARCH_API_KEY }}
          NEXT_PUBLIC_DEVICE_ATTESTATION_TOKEN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GTM_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_GTM_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
          PUBLIC_WWW_CATALOGUE_SNAPSHOT_PATH: ${{ runner.temp }}/promote-inputs/catalogue-snapshot.json
          PUBLIC_WWW_CATALOGUE_SNAPSHOT_REQUIRED: "true"
        # template:end

      - name: Run post-build checks
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        run: bash scripts/deploy/public-www-checks.sh post-build

      # template:optional indexnow
      - name: Write IndexNow key file
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 scripts/deploy/indexnow.py write-key apps/public_www/out

      # template:end

      - name: Configure AWS credentials
        if: ${{ success() && (needs.prepare.outputs.maintenance_mode == 'true' || needs.prepare.outputs.deploy == 'true') }}
        uses: lx-software-ltd/actions/aws-oidc@7389af585c4c2aad4221704b07ed2936106ff169 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Promote release or enable maintenance mode
        if: ${{ success() && (needs.prepare.outputs.maintenance_mode == 'true' || needs.prepare.outputs.deploy == 'true') }}
        run: bash scripts/deploy/deploy-public-www.sh
        # template:set
        env:
          PUBLIC_WWW_STACK_NAME: lxsoftware-siutindei-public-www
          PUBLIC_WWW_ENVIRONMENT: production
          PUBLIC_WWW_MAINTENANCE_MODE: ${{ needs.prepare.outputs.maintenance_mode }}
          PUBLIC_WWW_PROMOTE_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PUBLIC_WWW_PROMOTION_BUILD_DIR: ${{ needs.prepare.outputs.maintenance_mode != 'true' && format('{0}/apps/public_www/out', github.workspace) || '' }}
        # template:end

      # template:optional catalogue
      - name: Read the production staging bucket
        id: production_staging
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        uses: lx-software-ltd/actions/cfn-stack-outputs@7389af585c4c2aad4221704b07ed2936106ff169 # main 2026-11-24
        with:
          # template:set
          stack: public-www
          # template:end
          outputs: PublicWwwStagingBucketName
          region: ${{ vars.AWS_REGION }}

      - name: Record the live production build
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          CURRENT_DIGESTS: ${{ runner.temp }}/promote-inputs/catalogue-digests.json
          STACK_JSON: ${{ steps.production_staging.outputs.json }}
        run: |
          STAGING_BUCKET="$(python3 -c 'import json,os; print(json.loads(os.environ["STACK_JSON"])["PublicWwwStagingBucketName"])')"
          if [ -z "$STAGING_BUCKET" ]; then
            echo "Staging bucket output not found on Public Website stack"
            exit 1
          fi
          printf '%s\n' "$RELEASE_ID" | aws s3 cp --only-show-errors - "s3://$STAGING_BUCKET/releases/production-release-id.txt"
          git rev-parse HEAD | aws s3 cp --only-show-errors - "s3://$STAGING_BUCKET/releases/production-build-sha.txt"
          aws s3 cp --only-show-errors "$CURRENT_DIGESTS" "s3://$STAGING_BUCKET/releases/production-catalogue-digests.json"

      # template:end

      # template:optional indexnow
      - name: Notify IndexNow
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ needs.prepare.outputs.production_site_origin }}
          PROMOTION_MODE: ${{ needs.prepare.outputs.promotion_mode }}
          PREVIOUS_DIGESTS: ${{ runner.temp }}/promote-inputs/previous-catalogue-digests.json
          CURRENT_DIGESTS: ${{ runner.temp }}/promote-inputs/catalogue-digests.json
        run: |
          if [ "$PROMOTION_MODE" = "refresh_production" ]; then
            python3 scripts/deploy/indexnow.py ping apps/public_www/out --previous "$PREVIOUS_DIGESTS" --current "$CURRENT_DIGESTS"
          else
            python3 scripts/deploy/indexnow.py ping apps/public_www/out
          fi

      # template:end

      - name: Publish promotion summary
        run: bash scripts/deploy/publish-promotion-summary.sh
        # template:set
        env:
          PROMOTION_MODE: ${{ needs.prepare.outputs.promotion_mode }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRODUCTION_SITE_ORIGIN: ${{ needs.prepare.outputs.production_site_origin }}
        # template:end
