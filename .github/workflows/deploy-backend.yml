name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      destroy_before_deploy:
        description: "Run 'cdk destroy' before deploy"
        required: false
        default: false
        type: boolean
      force_migration_run:
        description: "Force RunMigrations custom resource"
        required: false
        default: false
        type: boolean
      run_seed_data:
        description: "Run seed data after migrations (backend stack only)"
        required: false
        default: false
        type: boolean
      cdk_stacks:
        description: "CDK stacks to deploy"
        required: false
        default: "all stacks"
        type: choice
        options:
          - "all stacks"
          - "lambda apis"
          - "admin web"
          - "public website"
          - "waf (us-east-1)"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "packages/models_shared/**"
      - "scripts/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Sync staging search fixture for Lambda bundle
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh backend

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: backend/infrastructure/package-lock.json

      # run-cdk-app.sh bundles Lambdas with Python 3.12. ubuntu-26.04 is
      # 26.04 and no longer includes that interpreter.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Determine deployment region
        id: region
        env:
          INPUT_CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          INPUT_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ "$INPUT_CDK_STACKS" = "waf (us-east-1)" ]; then
            echo "region=us-east-1" >> "$GITHUB_OUTPUT"
          else
            echo "region=$INPUT_AWS_REGION" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@b40bb0725bf84f25a38641f6ca5ec6f4c2f14f98 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ steps.region.outputs.region }}

      - name: Validate search area scope
        env:
          SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
        run: python3 scripts/deploy/validate_search_area_scope.py

      - name: Install CDK dependencies
        working-directory: backend/infrastructure
        run: npm ci

      - name: Bootstrap CDK
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          if [ -n "$CDK_BOOTSTRAP_QUALIFIER" ]; then
            npx cdk bootstrap --no-notices --qualifier "$CDK_BOOTSTRAP_QUALIFIER" "aws://$AWS_ACCOUNT_ID/$AWS_REGION"
          else
            npx cdk bootstrap --no-notices "aws://$AWS_ACCOUNT_ID/$AWS_REGION"
          fi
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ steps.region.outputs.region }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}

      - name: Checkout the pinned deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lx-software-ltd/actions
          ref: e6be2629d7206b0d5c079662f364772bc816acc1
          path: .actions-pin

      - name: Compare the dry run with the current deploy
        continue-on-error: true
        working-directory: backend/infrastructure
        env:
          AWS_REGION: ${{ steps.region.outputs.region }}
          CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          RUN_SEED_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed_data || 'false' }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          DESTROY_BEFORE_DEPLOY: ${{ github.event.inputs.destroy_before_deploy || 'false' }}
          CDK_PARAM_GOOGLE_CLIENT_SECRET: ${{ secrets.CDK_PARAM_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN }}
          CDK_PARAM_API_SECONDARY_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_API_SECONDARY_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_GOOGLE_PLACES_API_KEY: ${{ secrets.CDK_PARAM_GOOGLE_PLACES_API_KEY }}
          CDK_PARAM_OPENROUTER_API_KEY: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY }}
          CDK_PARAM_APPLE_PRIVATE_KEY: ${{ secrets.CDK_PARAM_APPLE_PRIVATE_KEY }}
          CDK_PARAM_PUBLIC_API_KEY_VALUE: ${{ secrets.CDK_PARAM_PUBLIC_API_KEY_VALUE }}
          CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN }}
          CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS }}
          CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD: ${{ secrets.CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
          MIGRATIONS_FORCE_RUN_ID: >-
            ${{ github.event.inputs.force_migration_run == 'true' &&
            github.run_id || '' }}
        run: |
          set -euo pipefail
          umask 077
          real_npx="$(command -v npx)"
          real_aws="$(command -v aws)"
          bindir="$RUNNER_TEMP/cdk-dry/bin"
          mkdir -p "$bindir"
          CURRENT_LOG="$RUNNER_TEMP/cdk-current.jsonl"
          ACTION_LOG="$RUNNER_TEMP/cdk-action.jsonl"
          rm -f "$CURRENT_LOG" "$ACTION_LOG"
          trap 'rm -f "$CURRENT_LOG" "$ACTION_LOG" "$RUNNER_TEMP/current-cdk.sh"' EXIT
          REAL_NPX="$real_npx" REAL_AWS="$real_aws" BINDIR="$bindir" python3 - << 'PY'
          import os
          from pathlib import Path

          bindir = Path(os.environ["BINDIR"])
          (bindir / "record.py").write_text(
              "import json, os, sys\n"
              'open(os.environ["DEPLOY_LOG"], "a", encoding="utf-8").write(json.dumps(sys.argv[1:]) + "\\n")\n'
          )
          npx = bindir / "npx"
          npx.write_text(
              "\n".join(
                  [
                      "#!/usr/bin/env bash",
                      "set -euo pipefail",
                      'real="${REAL_NPX:?}"',
                      'log="${DEPLOY_LOG:?}"',
                      'here="$(cd "$(dirname "$0")" && pwd)"',
                      'if [[ "${1:-}" == "cdk" && ( "${2:-}" == "deploy" || "${2:-}" == "destroy" || "${2:-}" == "bootstrap" ) ]]; then',
                      '  DEPLOY_LOG="$log" python3 "$here/record.py" npx "$@"',
                      "  exit 0",
                      "fi",
                      'exec "$real" "$@"',
                      "",
                  ]
              )
          )
          npx.chmod(0o755)
          aws = bindir / "aws"
          aws.write_text(
              "\n".join(
                  [
                      "#!/usr/bin/env bash",
                      "set -euo pipefail",
                      'real="${REAL_AWS:?}"',
                      'log="${DEPLOY_LOG:?}"',
                      'here="$(cd "$(dirname "$0")" && pwd)"',
                      'if [[ "${1:-}" == "cloudformation" ]]; then',
                      '  case "${2:-}" in',
                      "    describe-*|list-*|get-*)",
                      '      exec "$real" "$@"',
                      "      ;;",
                      "  esac",
                      "fi",
                      'DEPLOY_LOG="$log" python3 "$here/record.py" aws "$@"',
                      "exit 0",
                      "",
                  ]
              )
          )
          aws.chmod(0o755)
          PY
          : > "$CURRENT_LOG"
          REAL_NPX=/bin/false REAL_AWS=/bin/false DEPLOY_LOG="$CURRENT_LOG" PATH="$bindir:$PATH" \
            npx cdk deploy --require-approval never sentinel-stack
          REAL_NPX=/bin/false REAL_AWS=/bin/false DEPLOY_LOG="$CURRENT_LOG" PATH="$bindir:$PATH" \
            npx cdk destroy --force sentinel-stack
          REAL_NPX=/bin/false REAL_AWS=/bin/false DEPLOY_LOG="$CURRENT_LOG" PATH="$bindir:$PATH" \
            aws cloudformation continue-update-rollback --stack-name sentinel-stack
          LOG="$CURRENT_LOG" python3 - << 'PY'
          import json as _json
          import os
          from pathlib import Path

          rows = [_json.loads(line) for line in Path(os.environ["LOG"]).read_text(encoding="utf-8").splitlines()]
          cdk = [row for row in rows if row[:1] == ["npx"]]
          aws = [row for row in rows if row[:1] == ["aws"]]
          if [row[1:3] for row in cdk] != [["cdk", "deploy"], ["cdk", "destroy"]]:
              raise SystemExit("npx stub executed or failed to record")
          if len(aws) != 1 or aws[0][:3] != ["aws", "cloudformation", "continue-update-rollback"]:
              raise SystemExit("aws stub executed a CloudFormation write")
          PY
          : > "$CURRENT_LOG"
          export REAL_NPX="$real_npx"
          export REAL_AWS="$real_aws"
          export PATH="$bindir:$PATH"
          STEP_NAME="Deploy stacks" \
            WORKFLOW="$GITHUB_WORKSPACE/.github/workflows/deploy-backend.yml" \
            OUT="$RUNNER_TEMP/current-cdk.sh" \
            python3 - << 'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["WORKFLOW"]).read_text(encoding="utf-8")
          lines = text.splitlines()
          name = os.environ["STEP_NAME"]
          start = None
          for index, line in enumerate(lines):
              if line == f"      - name: {name}":
                  start = index
                  break
          if start is None:
              raise SystemExit("deploy step not found")
          end = len(lines)
          for index in range(start + 1, len(lines)):
              if lines[index].startswith("      - ") or (
                  lines[index].strip() and not lines[index].startswith(" ")
              ):
                  end = index
                  break
          step = lines[start:end]
          body = None
          for index, line in enumerate(step):
              if line != "        run: |":
                  continue
              kept = []
              for later in step[index + 1 :]:
                  if later.strip() == "":
                      kept.append("")
                      continue
                  if later.startswith("          "):
                      kept.append(later[10:])
                      continue
                  break
              body = "\n".join(kept).rstrip() + "\n"
              break
          if body is None or "npx cdk deploy" not in body:
              raise SystemExit("refusing to run a step that is not the current cdk deploy")
          if "REAL_NPX" in body or "cdk_deploy.py" in body:
              raise SystemExit("refusing to run the comparison step")
          Path(os.environ["OUT"]).write_text(body, encoding="utf-8")
          PY
          export DEPLOY_LOG="$CURRENT_LOG"
          bash "$RUNNER_TEMP/current-cdk.sh" || true
          export DEPLOY_LOG="$ACTION_LOG"
          python3 - << 'PY' || true
          import importlib.util
          import os
          import sys

          import json as _json
          import os

          def normalize(value):
              text = value.strip()
              if text == "all stacks":
                  return "lxsoftware-siutindei lxsoftware-siutindei-admin-web lxsoftware-siutindei-public-www"
              if text == "lambda apis":
                  return "lxsoftware-siutindei"
              if text == "admin web":
                  return "lxsoftware-siutindei-admin-web"
              if text in {"public website", "public www", "public website staging", "public www staging"}:
                  return "lxsoftware-siutindei-public-www"
              if text == "waf (us-east-1)":
                  return "lxsoftware-siutindei-waf"
              return text

          def build_plan():
              os.environ["STACKS"] = normalize(os.environ.get("CDK_STACKS", ""))
              return {
                  "api-stack": "lxsoftware-siutindei",
                  "also-api": ["PublicWwwOriginVerifySecret"],
                  "routes": [
                      {
                          "stack": "lxsoftware-siutindei-admin-web",
                          "parameters": ["AdminWebDomainName", "AdminWebCertificateArn", "WafWebAclArn"],
                          "skip-empty": ["WafWebAclArn"],
                      },
                      {
                          "stack": "lxsoftware-siutindei-public-www",
                          "parameters": [
                              "PublicWwwDomainName",
                              "PublicWwwCertificateArn",
                              "PublicWwwStagingDomainName",
                              "PublicWwwStagingCertificateArn",
                              "WafWebAclArn",
                              "SearchApiProxyOriginDomain",
                              "PublicWwwEdgeVerifySecret",
                              "PublicWwwEdgeVerifySecretPrevious",
                              "PublicWwwStagingEdgeVerifySecret",
                              "PublicWwwStagingEdgeVerifySecretPrevious",
                              "PublicWwwOriginVerifySecret",
                          ],
                      },
                  ],
                  "groups": [
                      {
                          "stacks": [
                              "lxsoftware-siutindei",
                              "lxsoftware-siutindei-admin-web",
                              "lxsoftware-siutindei-public-www",
                              "lxsoftware-siutindei-waf",
                          ]
                      }
                  ],
              }

          def configure() -> None:
              os.environ["PLAN"] = _json.dumps(build_plan())
              os.environ["PARAM_FILE"] = os.environ.get("CDK_PARAM_FILE", "")
              os.environ["WORKING_DIRECTORY"] = ""
              os.environ["FORMAT"] = "plain-json"
              os.environ["ATTEMPTS"] = "3"
              os.environ["NO_NOTICES"] = "true"
              os.environ["PASS_EMPTY"] = "WafWebAclArn,CognitoCustomDomainName,CognitoCustomDomainCertificateArn,ApiCustomDomainName,ApiCustomDomainCertificateArn,SearchAreaScope"
              os.environ["ESCAPE_NEWLINES"] = "true"
              os.environ["SKIP_RESOURCE"] = "RunMigrations"
              os.environ["ROLLBACK_MATCH"] = "UPDATE_ROLLBACK_FAILED"
              seed = os.environ.get("RUN_SEED_DATA", "false").strip().lower()
              os.environ["RUN_SEED"] = "true" if seed == "true" else "false"
              destroy = os.environ.get("DESTROY_BEFORE_DEPLOY", "false").strip().lower()
              os.environ["DESTROY"] = "true" if destroy == "true" else "false"

          configure()
          path = os.environ["GITHUB_WORKSPACE"] + "/.actions-pin/cdk-deploy/cdk_deploy.py"
          spec = importlib.util.spec_from_file_location("cdk_deploy", path)
          if spec is None or spec.loader is None:
              raise SystemExit("cdk_deploy.py is not in the pinned checkout")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          raise SystemExit(module.main())
          PY
          CURRENT="$CURRENT_LOG" ACTION="$ACTION_LOG" python3 - << 'PY'
          import json as _json
          import os
          import re
          import sys
          from pathlib import Path

          account = re.compile(r"\b\d{12}\b")

          def load(path):
              text = Path(path).read_text(encoding="utf-8")
              return [_json.loads(line) for line in text.splitlines() if line.strip()]

          def signature(argv):
              flags = []
              params = []
              positional = []
              index = 0
              while index < len(argv):
                  token = argv[index]
                  if token == "--parameters" and index + 1 < len(argv):
                      params.append(argv[index + 1])
                      index += 2
                      continue
                  if token.startswith("--") and index + 1 < len(argv) and not argv[index + 1].startswith("-"):
                      flags.append((token, argv[index + 1]))
                      index += 2
                      continue
                  if token.startswith("-"):
                      flags.append((token, ""))
                      index += 1
                      continue
                  positional.append(token)
                  index += 1
              if len(positional) < 3 or positional[1] != "cdk":
                  return None
              if positional[2] not in {"deploy", "destroy"}:
                  return None
              return (positional[2], tuple(positional[3:]), tuple(sorted(flags)), tuple(sorted(params)))

          def keys(params):
              return [item.split("=", 1)[0] for item in params]

          def show(label, sig):
              command, stacks, flags, params = sig
              flag_text = " ".join(flag + (" " + value if value else "") for flag, value in flags)
              print(
                  account.sub("************", f"{label}: cdk {command} {flag_text} stacks {' '.join(stacks)}"),
                  file=sys.stderr,
              )
              print(f"{label} parameters: {', '.join(keys(params))}", file=sys.stderr)

          current = [item for item in (signature(row) for row in load(os.environ["CURRENT"])) if item]
          action = [item for item in (signature(row) for row in load(os.environ["ACTION"])) if item]
          if not current or current != action:
              print("planned CDK changes differ", file=sys.stderr)
              for index in range(max(len(current), len(action))):
                  left = current[index] if index < len(current) else None
                  right = action[index] if index < len(action) else None
                  if left == right:
                      continue
                  if left is not None:
                      show("current", left)
                  if right is not None:
                      show("action", right)
                  if left is not None and right is not None:
                      left_values = {item.split("=", 1)[0]: item.split("=", 1)[1] for item in left[3]}
                      right_values = {item.split("=", 1)[0]: item.split("=", 1)[1] for item in right[3]}
                      for key in sorted(set(left_values) & set(right_values)):
                          if left_values[key] != right_values[key]:
                              print(f"parameter value differs for {key}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Dry run matches the current deploy ({len(current)} planned CDK changes)")
          PY

      - name: Deploy stacks
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          npm run build --if-present

          if [ "${CDK_STACKS:-}" = "all stacks" ]; then
            CDK_STACKS="lxsoftware-siutindei lxsoftware-siutindei-admin-web lxsoftware-siutindei-public-www"
          elif [ "${CDK_STACKS:-}" = "lambda apis" ]; then
            CDK_STACKS="lxsoftware-siutindei"
          elif [ "${CDK_STACKS:-}" = "admin web" ]; then
            CDK_STACKS="lxsoftware-siutindei-admin-web"
          elif [ "${CDK_STACKS:-}" = "public website" ] || \
            [ "${CDK_STACKS:-}" = "public www" ] || \
            [ "${CDK_STACKS:-}" = "public website staging" ] || \
            [ "${CDK_STACKS:-}" = "public www staging" ]; then
            CDK_STACKS="lxsoftware-siutindei-public-www"
          elif [ "${CDK_STACKS:-}" = "waf (us-east-1)" ]; then
            CDK_STACKS="lxsoftware-siutindei-waf"
          fi

          PARAM_ARGS=()

          resolve_param_file() {
            local path="$1"
            if [ -z "$path" ]; then
              return 1
            fi
            if [ -f "$path" ]; then
              echo "$path"
              return 0
            fi
            if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "$GITHUB_WORKSPACE/$path"
              return 0
            fi
            return 1
          }

          if [ -n "${CDK_PARAM_FILE:-}" ]; then
            RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
            if [ -z "$RESOLVED_PARAM_FILE" ]; then
              echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
              exit 1
            fi
            PARAM_ARGS_FILE="$(mktemp)"
            PARAM_FILE="$RESOLVED_PARAM_FILE" STACKS="$CDK_STACKS" python3 - <<'PY' > "$PARAM_ARGS_FILE"
          import json
          import os
          import sys

          with open(os.environ["PARAM_FILE"], "r", encoding="utf-8") as handle:
              params = json.load(handle)

          stack_set = set(os.environ.get("STACKS", "").split())
          api_stack = "lxsoftware-siutindei"
          admin_web_stack = "lxsoftware-siutindei-admin-web"
          public_stack = "lxsoftware-siutindei-public-www"
          admin_web_params = {"AdminWebDomainName", "AdminWebCertificateArn", "WafWebAclArn"}
          public_params = {
              "PublicWwwDomainName",
              "PublicWwwCertificateArn",
              "PublicWwwStagingDomainName",
              "PublicWwwStagingCertificateArn",
              "WafWebAclArn",
              "SearchApiProxyOriginDomain",
              "PublicWwwEdgeVerifySecret",
              "PublicWwwEdgeVerifySecretPrevious",
              "PublicWwwStagingEdgeVerifySecret",
              "PublicWwwStagingEdgeVerifySecretPrevious",
          }
          # Authorizer (API stack) and CloudFront origin header (public stack).
          origin_verify_param = "PublicWwwOriginVerifySecret"
          # Omitted parameters keep their previous stack value, so an empty
          # value would never reach CloudFormation. Switching the Cognito
          # custom domain or removing the API custom domain needs a deploy
          # with these empty.
          pass_empty_params = {
              "WafWebAclArn",
              "CognitoCustomDomainName",
              "CognitoCustomDomainCertificateArn",
              "ApiCustomDomainName",
              "ApiCustomDomainCertificateArn",
              # Clearing SEARCH_AREA_SCOPE must reach CloudFormation.
              # An omitted parameter would keep the previous neighbourhood list.
              "SearchAreaScope",
          }

          def resolve_value(raw: str) -> str:
              """Replace <FROM_GITHUB_SECRET: X> / <FROM_GITHUB_VAR: X> placeholders."""
              raw = raw.strip()
              if raw.startswith("<FROM_GITHUB_SECRET:") and raw.endswith(">"):
                  env_name = raw[len("<FROM_GITHUB_SECRET:") : -1].strip()
                  return os.environ.get(env_name, "")
              if raw.startswith("<FROM_GITHUB_VAR:") and raw.endswith(">"):
                  env_name = raw[len("<FROM_GITHUB_VAR:") : -1].strip()
                  return os.environ.get(env_name, "")
              return raw

          for key, value in params.items():
              value_str = ""
              if value is not None:
                  value_str = resolve_value(str(value))
              value_str = value_str.replace("\r\n", "\n").replace("\r", "\n")
              value_str = value_str.replace("\n", "\\n").strip()
              if key not in pass_empty_params and not value_str:
                  continue

              targets = []
              if key == origin_verify_param:
                  targets.extend([api_stack, public_stack])
              if key in admin_web_params:
                  if value_str or key != "WafWebAclArn":
                      targets.append(admin_web_stack)
              if key in public_params:
                  targets.append(public_stack)
              if not targets:
                  targets.append(api_stack)

              for target in targets:
                  if target not in stack_set:
                      continue
                  sys.stdout.buffer.write(b"--parameters\0")
                  sys.stdout.buffer.write(
                      f"{target}:{key}={value_str}".encode("utf-8") + b"\0"
                  )
          PY
            mapfile -d '' -t PARAM_ARGS < "$PARAM_ARGS_FILE"
          fi

          RUN_SEED_DATA_NORMALIZED="$(printf '%s' "${RUN_SEED_DATA:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$RUN_SEED_DATA_NORMALIZED" = "true" ]; then
            if [[ " $CDK_STACKS " == *" lxsoftware-siutindei "* ]]; then
              FILTERED_PARAM_ARGS=()
              for arg in "${PARAM_ARGS[@]}"; do
                if [[ "$arg" == "lxsoftware-siutindei:RunSeedData="* ]]; then
                  continue
                fi
                FILTERED_PARAM_ARGS+=("$arg")
              done
              PARAM_ARGS=("${FILTERED_PARAM_ARGS[@]}")
              PARAM_ARGS+=("--parameters" "lxsoftware-siutindei:RunSeedData=true")
              echo "RunSeedData override enabled for lxsoftware-siutindei stack."
            else
              echo "run_seed_data=true requested, but API stack is not selected; skipping seed override."
            fi
          fi

          # bin/app.ts reads CDK_BOOTSTRAP_QUALIFIER. deploy and destroy
          # reject --qualifier (it is a bootstrap-only flag) and print
          # "Unknown option(s): --qualifier".
          IFS=$', \n\t' read -r -a STACK_LIST <<< "$CDK_STACKS"

          if [ "${DESTROY_BEFORE_DEPLOY:-false}" = "true" ]; then
            if [ ${#STACK_LIST[@]} -gt 0 ]; then
              npx cdk destroy --no-notices --force "${STACK_LIST[@]}"
            else
              npx cdk destroy --no-notices --force lxsoftware-siutindei
            fi
          fi

          MANAGED_STACKS=(
            lxsoftware-siutindei
            lxsoftware-siutindei-admin-web
            lxsoftware-siutindei-public-www
            lxsoftware-siutindei-waf
          )

          # One continue-update-rollback plus its waiter. The AWS call's
          # own exit code is captured without a pipe: with or without
          # pipefail, tee must not hide it. A failed waiter is retried
          # once with RunMigrations skipped, because CloudFormation
          # accepts the first call and only the waiter sees the resource
          # fail again.
          rollback_stack_once() {
            local managed="$1"
            shift
            local -a skip_args=("$@")
            local rollback_log status
            rollback_log="$(mktemp)"
            if [ ${#skip_args[@]} -eq 0 ]; then
              echo "Stack ${managed} is in UPDATE_ROLLBACK_FAILED; calling continue-update-rollback."
            else
              echo "Stack ${managed} is in UPDATE_ROLLBACK_FAILED; calling continue-update-rollback with ${skip_args[*]}."
            fi
            if ! aws cloudformation continue-update-rollback \
              --stack-name "$managed" \
              --region "$AWS_REGION" \
              "${skip_args[@]}" >"$rollback_log" 2>&1; then
              cat "$rollback_log"
              if [ ${#skip_args[@]} -eq 0 ] && grep -q RunMigrations "$rollback_log"; then
                rm -f "$rollback_log"
                echo "Retrying continue-update-rollback for ${managed} with RunMigrations skipped."
                if ! rollback_stack_once "$managed" --resources-to-skip RunMigrations; then
                  return 1
                fi
                return 0
              fi
              rm -f "$rollback_log"
              echo "continue-update-rollback failed for ${managed}."
              return 1
            fi
            cat "$rollback_log"
            rm -f "$rollback_log"
            echo "Waiting for ${managed} to reach UPDATE_ROLLBACK_COMPLETE (timeout ~15m)."
            if ! aws cloudformation wait stack-rollback-complete \
              --stack-name "$managed" \
              --region "$AWS_REGION"; then
              status="$(aws cloudformation describe-stacks \
                --stack-name "$managed" \
                --region "$AWS_REGION" \
                --query 'Stacks[0].StackStatus' \
                --output text 2>&1 || true)"
              echo "Stack ${managed} did not reach UPDATE_ROLLBACK_COMPLETE (status: ${status})."
              if [ ${#skip_args[@]} -eq 0 ]; then
                echo "Retrying continue-update-rollback for ${managed} with RunMigrations skipped."
                if ! rollback_stack_once "$managed" --resources-to-skip RunMigrations; then
                  return 1
                fi
                return 0
              fi
              return 1
            fi
            status="$(aws cloudformation describe-stacks \
              --stack-name "$managed" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text)"
            echo "Stack ${managed} status after rollback: ${status}"
            if [ "$status" != "UPDATE_ROLLBACK_COMPLETE" ]; then
              echo "Stack ${managed} is ${status}, expected UPDATE_ROLLBACK_COMPLETE."
              return 1
            fi
          }

          continue_rollback_for_wedged_stacks() {
            for managed in "${MANAGED_STACKS[@]}"; do
              if [[ ! " $CDK_STACKS " == *" $managed "* ]]; then
                continue
              fi
              local status
              status="$(aws cloudformation describe-stacks \
                --stack-name "$managed" \
                --region "$AWS_REGION" \
                --query 'Stacks[0].StackStatus' \
                --output text 2>/dev/null || echo MISSING)"
              if [ "$status" != "UPDATE_ROLLBACK_FAILED" ]; then
                continue
              fi
              # RunMigrations cannot roll back after a new migration has been
              # applied: the rolled-back Lambda bundle no longer contains the
              # revision the database is at. Skipping it is safe (migrations
              # are forward-only) and unwedges the rollback.
              local skip_args=()
              local describe_err
              describe_err="$(mktemp)"
              local failed_resources=""
              if ! failed_resources="$(aws cloudformation describe-stack-resources \
                --stack-name "$managed" \
                --region "$AWS_REGION" \
                --query "StackResources[?ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].LogicalResourceId" \
                --output text 2>"$describe_err")"; then
                echo "describe-stack-resources failed for ${managed}:"
                cat "$describe_err"
                failed_resources=""
              fi
              rm -f "$describe_err"
              echo "Resources in UPDATE_FAILED or UPDATE_ROLLBACK_FAILED for ${managed}: ${failed_resources:-<none>}"
              describe_err="$(mktemp)"
              local migration_events=""
              if ! migration_events="$(aws cloudformation describe-stack-events \
                --stack-name "$managed" \
                --region "$AWS_REGION" \
                --max-items 50 \
                --query "StackEvents[?contains(LogicalResourceId, 'RunMigrations')].[ResourceStatus,ResourceStatusReason]" \
                --output text 2>"$describe_err")"; then
                echo "describe-stack-events failed for ${managed}:"
                cat "$describe_err"
                migration_events=""
              fi
              rm -f "$describe_err"
              echo "RunMigrations recent events for ${managed}: ${migration_events:-<none>}"
              if grep -q RunMigrations <<< "$failed_resources" \
                || grep -q "Can't locate revision" <<< "$migration_events" \
                || grep -q "did not finish" <<< "$migration_events"; then
                echo "RunMigrations blocked the rollback; skipping it in continue-update-rollback."
                skip_args=(--resources-to-skip RunMigrations)
              fi
              if ! rollback_stack_once "$managed" "${skip_args[@]}"; then
                return 1
              fi
            done
          }

          MAX_CDK_DEPLOY_ATTEMPTS=3
          attempt=1
          deploy_exit=1
          while [ "$attempt" -le "$MAX_CDK_DEPLOY_ATTEMPTS" ]; do
            echo "CDK deploy attempt ${attempt} of ${MAX_CDK_DEPLOY_ATTEMPTS}"
            ATTEMPT_LOG="$(mktemp)"
            npx cdk deploy --no-notices --require-approval never \
              "${PARAM_ARGS[@]}" "${STACK_LIST[@]}" \
              2>&1 | tee "$ATTEMPT_LOG"
            deploy_exit=${PIPESTATUS[0]}
            if [ "$deploy_exit" -eq 0 ]; then
              rm -f "$ATTEMPT_LOG"
              exit 0
            fi

            if grep -Eiq 'HandlerErrorCode: (InvalidRequest|AlreadyExists)|must be in ARN format or "\\*"|already exists\.' "$ATTEMPT_LOG"; then
              echo "Detected non-retryable CloudFormation error; failing fast without additional retries."
              rm -f "$ATTEMPT_LOG"
              exit "$deploy_exit"
            fi

            saw_rollback_failed=0
            # The wedged status is already in this attempt's log. Waiting for
            # the next attempt's "can not be updated" spends a deploy first.
            if grep -Eiq 'UPDATE_ROLLBACK_FAILED' "$ATTEMPT_LOG"; then
              saw_rollback_failed=1
            fi

            rm -f "$ATTEMPT_LOG"
            if [ "$attempt" -eq "$MAX_CDK_DEPLOY_ATTEMPTS" ]; then
              break
            fi

            if [ "$saw_rollback_failed" -eq 1 ]; then
              echo "Detected UPDATE_ROLLBACK_FAILED; attempting continue-update-rollback before retry."
              if ! continue_rollback_for_wedged_stacks; then
                echo "Could not recover the wedged stack."
                exit 1
              fi
            fi

            delay=$((45 * attempt))
            echo "CDK deploy failed (exit ${deploy_exit}); waiting ${delay}s before retry..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          exit "$deploy_exit"
        env:
          AWS_REGION: ${{ steps.region.outputs.region }}
          CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          RUN_SEED_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed_data || 'false' }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          DESTROY_BEFORE_DEPLOY: ${{ github.event.inputs.destroy_before_deploy || 'false' }}
          CDK_PARAM_GOOGLE_CLIENT_SECRET: ${{ secrets.CDK_PARAM_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN }}
          CDK_PARAM_API_SECONDARY_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_API_SECONDARY_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_GOOGLE_PLACES_API_KEY: ${{ secrets.CDK_PARAM_GOOGLE_PLACES_API_KEY }}
          CDK_PARAM_OPENROUTER_API_KEY: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY }}
          CDK_PARAM_APPLE_PRIVATE_KEY: ${{ secrets.CDK_PARAM_APPLE_PRIVATE_KEY }}
          CDK_PARAM_PUBLIC_API_KEY_VALUE: ${{ secrets.CDK_PARAM_PUBLIC_API_KEY_VALUE }}
          CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN }}
          CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_ORIGIN_VERIFY_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS }}
          CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD: ${{ secrets.CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
          MIGRATIONS_FORCE_RUN_ID: >-
            ${{ github.event.inputs.force_migration_run == 'true' &&
            github.run_id || '' }}
