name: Deploy Public Website Staging

on:
  repository_dispatch:
    types: [deploy-public-www-staging]
  workflow_dispatch:
  push:
    branches:
# template:set
      - staging
# template:end
    paths:
# template:set
      - "apps/public_www/**"
      - "scripts/deploy/deploy-public-www.sh"
      - "scripts/deploy/fetch-public-www-catalogue-snapshot.sh"
      - ".github/workflows/deploy-public-www-staging.yml"
# template:end

permissions:
  contents: read

concurrency:
  group: deploy-public-www-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Audit public website production dependencies
        run: npm run audit:deps:prod
        working-directory: apps/public_www

      - name: Audit public website assets
        run: npm run audit:assets
        working-directory: apps/public_www

# template:optional search-fixture
      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Sync staging search fixture for static hosting
        run: bash scripts/codegen/sync-activity-search-staging-fixture.sh public-www
# template:end

      - name: Run pre-build checks
        run: bash scripts/deploy/public-www-checks.sh pre-build
# template:set
        env:
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || steps.resolve_public_site_config.outputs.site_name }}
          NEXT_PUBLIC_SITE_TAGLINE: ${{ vars.NEXT_PUBLIC_SITE_TAGLINE || steps.resolve_public_site_config.outputs.site_tagline }}
          NEXT_PUBLIC_STAGING_SEARCH_DATA_ENABLED: ${{ vars.STAGING_SEARCH_DATA_ENABLED || 'true' }}
          NEXT_PUBLIC_SEARCH_API_KEY: ${{ vars.STAGING_SEARCH_DATA_ENABLED == 'false' && secrets.NEXT_PUBLIC_SEARCH_API_KEY || '' }}
          NEXT_PUBLIC_DEVICE_ATTESTATION_TOKEN: ${{ vars.STAGING_SEARCH_DATA_ENABLED == 'false' && secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN || '' }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GTM_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_GTM_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
          SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
# template:end

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

# template:optional catalogue
      # While the fixture is on, the build derives a capped catalogue from
      # it instead.
      - name: Download catalogue snapshot
        id: catalogue_snapshot
        if: ${{ success() && vars.STAGING_SEARCH_DATA_ENABLED == 'false' }}
        env:
          SNAPSHOT_OUTPUT_PATH: ${{ runner.temp }}/catalogue-snapshot.json
        run: bash scripts/deploy/fetch-public-www-catalogue-snapshot.sh
# template:end

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/public_www/.next/cache
          # template:set
          key: ${{ runner.os }}-nextjs-public-www-${{ hashFiles('apps/public_www/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-public-www-
          # template:end

      - name: Build public website
        run: npm run build
        working-directory: apps/public_www
# template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || steps.resolve_public_site_config.outputs.site_name }}
          NEXT_PUBLIC_SITE_TAGLINE: ${{ vars.NEXT_PUBLIC_SITE_TAGLINE || steps.resolve_public_site_config.outputs.site_tagline }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL || steps.resolve_public_site_config.outputs.contact_email }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_STAGING_BADGE_ENABLED: "true"
          NEXT_PUBLIC_STAGING_SEARCH_DATA_ENABLED: ${{ vars.STAGING_SEARCH_DATA_ENABLED || 'true' }}
          NEXT_PUBLIC_STAGING_SEARCH_FIXTURE_URL: ${{ vars.NEXT_PUBLIC_STAGING_SEARCH_FIXTURE_URL }}
          NEXT_PUBLIC_SEARCH_API_KEY: ${{ vars.STAGING_SEARCH_DATA_ENABLED == 'false' && secrets.NEXT_PUBLIC_SEARCH_API_KEY || '' }}
          NEXT_PUBLIC_DEVICE_ATTESTATION_TOKEN: ${{ vars.STAGING_SEARCH_DATA_ENABLED == 'false' && secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN || '' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GTM_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_GTM_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SEARCH_AREA_SCOPE: ${{ vars.SEARCH_AREA_SCOPE }}
          PUBLIC_WWW_CATALOGUE_SNAPSHOT_PATH: ${{ steps.catalogue_snapshot.outputs.path }}
# template:end

      - name: Run post-build checks
        run: bash scripts/deploy/public-www-checks.sh post-build
        # template:set
        # template:end

      - name: Optimize public website images
        run: bash scripts/deploy/deploy-public-www.sh
        env:
          PUBLIC_WWW_PHASE: optimize

      - name: Deploy public website
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          source: apps/public_www/out
# template:set
          stack: lxsoftware-siutindei-public-www
# template:end
          region: ${{ vars.AWS_REGION }}
          bucket-output: PublicWwwStagingBucketName
          distribution-output: ""
          profile: next-site
          # template:set
          document-cache: public, max-age=300, must-revalidate, stale-while-revalidate=60
          # template:end
          release-id: ${{ github.sha }}
          release-marker: "true"
          # template:set
          marker-cache: no-store, max-age=0
          marker-content-type: text/plain; charset=utf-8
          # template:end
          staging-robots: "true"
          dry-run: "false"

      - name: Finish the staging release
        run: bash scripts/deploy/deploy-public-www.sh
        env:
          # template:set
          PUBLIC_WWW_STACK_NAME: lxsoftware-siutindei-public-www
          # template:end
          PUBLIC_WWW_ENVIRONMENT: staging
          PUBLIC_WWW_RELEASE_ID: ${{ github.sha }}
          PUBLIC_WWW_UPLOAD: external

      - name: Run staging smoke checks
        run: npm run smoke:staging
        working-directory: apps/public_www
        env:
          SMOKE_BASE_URL: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
# template:set
          NEXT_TELEMETRY_DISABLED: "1"
          STAGING_BYPASS_SECRET: ${{ secrets.STAGING_BYPASS_SECRET }}
          NEXT_PUBLIC_STAGING_SEARCH_DATA_ENABLED: ${{ vars.STAGING_SEARCH_DATA_ENABLED || 'true' }}
          NEXT_PUBLIC_SEARCH_API_KEY: ${{ vars.STAGING_SEARCH_DATA_ENABLED == 'false' && secrets.NEXT_PUBLIC_SEARCH_API_KEY || '' }}
          NEXT_PUBLIC_DEVICE_ATTESTATION_TOKEN: ${{ vars.STAGING_SEARCH_DATA_ENABLED == 'false' && secrets.CDK_PARAM_PUBLIC_WWW_ATTESTATION_TOKEN || '' }}
# template:end

      - name: Publish staging release summary
        run: bash scripts/deploy/publish-staging-summary.sh
        env:
          # template:set
          PUBLIC_WWW_STACK_NAME: lxsoftware-siutindei-public-www
          STAGING_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
          # template:end
