name: board-promote
run-name: board-promote ${{ inputs.kind || 'production' }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Promotion kind (production)
        required: false
        type: string
        default: production

# The owner merges the staging → main PR in GitHub. This workflow never merges.
# Optional BOARD_PR_TOKEN (PAT or GitHub App) so gh pr create is not run with
# GITHUB_TOKEN — those PRs do not start lint/test and often sit in
# action_required. With the PAT as author, workflows run without approval.
permissions:
  contents: read

concurrency:
  group: board-promote
  cancel-in-progress: false

jobs:
  open-pr:
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or update staging → main PR
        env:
          GH_TOKEN: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          KIND: ${{ inputs.kind || 'production' }}
        run: bash scripts/board/open-board-promote-pr.sh
