name: Board Agent
run-name: Board Agent ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      issue:
        required: true
        type: string
      brief:
        required: true
        type: string
      kind:
        description: feature, fix, or content. content may only change content/**
        required: true
        type: choice
        options:
          - feature
          - fix
          - content
      pr_number:
        required: false
        type: string
        description: Existing board/* PR to revise (do not start from staging)
      ci_failure:
        required: false
        type: string
        description: CI failure excerpt to fix
      revision_round:
        required: false
        type: string

# Secrets: CURSOR_API_KEY. Optional BOARD_PR_TOKEN (PAT or GitHub App) so the
# draft PR is not opened with GITHUB_TOKEN — those PRs do not start lint/test
# and often sit in action_required. No AWS.
permissions:
  contents: read

concurrency:
  group: board-agent-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  # Pin the Cursor CLI build. Bump this string when the owner upgrades.
  CURSOR_CLI_VERSION: 2026.09.10-fd3934a

jobs:
  run:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16@sha256:72d22ce26d04fe56a5384e9f6b026152d1cf05db602a7a3524a3ed337d5f5752 # linux/amd64 2026-11-22
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test
    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: staging
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Branch
        env:
          GH_TOKEN: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr checkout "${PR_NUMBER}"
          else
            git checkout -B "board/${TASK_ID}"
          fi

      - name: Write brief
        env:
          BOARD_BRIEF: ${{ inputs.brief }}
          CI_FAILURE: ${{ inputs.ci_failure }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BOARD_BRIEF" > "${RUNNER_TEMP}/brief.txt"
          if [ -n "${CI_FAILURE:-}" ]; then
            printf '\n\nCI failure:\n%s\n' "$CI_FAILURE" >> "${RUNNER_TEMP}/brief.txt"
          fi

      - name: Install pinned Cursor CLI
        run: bash scripts/board/install-cursor-cli.sh
      - name: Cursor agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BOARD_KIND: ${{ inputs.kind }}
          CURSOR_HOOK_MARKER: ${{ runner.temp }}/cursor-hook-session-start
        run: bash scripts/board/run-cursor-agent.sh
      - name: Upload agent transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board-agent-transcript-${{ inputs.task_id }}
          path: ${{ runner.temp }}/agent-transcript.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Require sessionStart hook
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/cursor-hook-session-start"

      - name: Guard protected paths
        env:
          BOARD_KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          python3 scripts/ci/board_policy.py \
            --check-worktree origin/staging \
            --kind "${BOARD_KIND}"

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@1433c6db97db3d774638175d1882138ef89ecce5 # main 2026-11-27

      - name: Test
        run: bash scripts/board/test-board-change.sh
      - name: Commit and draft PR
        env:
          GH_TOKEN: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TASK_ID: ${{ inputs.task_id }}
          ISSUE: ${{ inputs.issue }}
          BOARD_KIND: ${{ inputs.kind }}
        run: bash scripts/board/commit-board-pr.sh
