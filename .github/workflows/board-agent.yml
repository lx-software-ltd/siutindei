name: board-agent
run-name: board-agent ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      issue:
        required: true
        type: string
      brief:
        required: true
        type: string
      kind:
        required: true
        type: string
      pr_number:
        required: false
        type: string
        description: Existing board/* PR to revise (do not start from staging)
      ci_failure:
        required: false
        type: string
        description: CI failure excerpt to fix
      revision_round:
        required: false
        type: string

# Secrets: CURSOR_API_KEY. Optional BOARD_PR_TOKEN (PAT or GitHub App) so the
# draft PR is not opened with GITHUB_TOKEN — those PRs do not start lint/test
# and often sit in action_required. No AWS.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: board-agent-${{ inputs.task_id }}
  cancel-in-progress: false

env:
  # Pin the Cursor CLI build. Bump this string when the owner upgrades.
  CURSOR_CLI_VERSION: 2026.09.10-fd3934a

jobs:
  run:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/backend_test
    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Branch
        env:
          GH_TOKEN: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr checkout "${PR_NUMBER}"
          else
            git checkout -B "board/${TASK_ID}"
          fi

      - name: Write brief
        env:
          BOARD_BRIEF: ${{ inputs.brief }}
          CI_FAILURE: ${{ inputs.ci_failure }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BOARD_BRIEF" > "${RUNNER_TEMP}/brief.txt"
          if [ -n "${CI_FAILURE:-}" ]; then
            printf '\n\nCI failure:\n%s\n' "$CI_FAILURE" >> "${RUNNER_TEMP}/brief.txt"
          fi

      - name: Install pinned Cursor CLI
        run: |
          set -euo pipefail
          os=linux
          arch=x64
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64 ;;
            x86_64|amd64) arch=x64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          version="${CURSOR_CLI_VERSION}"
          dest="${HOME}/.local/share/cursor-agent/versions/${version}"
          mkdir -p "${dest}" "${HOME}/.local/bin"
          curl -fsSL \
            "https://downloads.cursor.com/lab/${version}/${os}/${arch}/agent-cli-package.tar.gz" \
            | tar --strip-components=1 -xzf - -C "${dest}"
          ln -sfn "${dest}/cursor-agent" "${HOME}/.local/bin/agent"
          ln -sfn "${dest}/cursor-agent" "${HOME}/.local/bin/cursor-agent"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cursor/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/cursor-agent" --version

      - name: Cursor agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BOARD_KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY is not set" >&2
            exit 1
          fi
          {
            echo "Follow AGENTS.md. Treat the brief as acceptance criteria."
            echo "Do not modify **/auth/**, **/payments/**, **/migrations/**,"
            echo "infra/**, or .github/**."
            echo "Do not commit, push, or open pull requests. Only edit files."
            echo "Kind: ${BOARD_KIND}"
            echo
            cat "${RUNNER_TEMP}/brief.txt"
          } > "${RUNNER_TEMP}/prompt.txt"
          cursor-agent -p "$(cat "${RUNNER_TEMP}/prompt.txt")" \
            --model composer-2.5 --yolo

      - name: Guard protected paths
        env:
          BOARD_KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          python3 scripts/ci/board_policy.py \
            --check-worktree origin/staging \
            --kind "${BOARD_KIND}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test
        run: |
          set -euo pipefail
          if git diff --quiet origin/staging -- \
            && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes from staging; skip repo tests"
            exit 0
          fi
          if git diff --name-only origin/staging -- backend tests \
            | grep -q . \
            || git ls-files --others --exclude-standard -- backend tests | grep -q .; then
            python -m pip install --upgrade pip
            if [ -f backend/dev-requirements.txt ]; then
              python -m pip install -r backend/dev-requirements.txt
            else
              python -m pip install -r backend/requirements.txt
              python -m pip install 'pytest>=8.0'
            fi
            python -m alembic -c backend/db/alembic.ini upgrade head
            python -m pytest tests backend --tb=short -q
          else
            echo "No backend/tests changes; Flutter and Node stay on PR CI (test.yml)."
          fi

      - name: Commit and draft PR
        env:
          GH_TOKEN: ${{ secrets.BOARD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TASK_ID: ${{ inputs.task_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          title="board: #${ISSUE} $(head -n 1 "${RUNNER_TEMP}/brief.txt")"
          git commit -m "${title}" || true
          git fetch origin staging
          ahead="$(git rev-list --count "origin/staging..HEAD")"
          if [ "${ahead}" = "0" ]; then
            echo "No unique commits vs staging; skip draft PR (dry-run / no-op)"
            exit 0
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            git push -u origin HEAD
            echo "Updated existing PR #${PR_NUMBER}"
            exit 0
          fi
          git push -u origin "HEAD:board/${TASK_ID}" --force-with-lease
          body="$(cat "${RUNNER_TEMP}/brief.txt")

          Task: ${TASK_ID}"
          existing="$(gh pr list --head "board/${TASK_ID}" --base staging \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
            echo "Updated existing PR #${existing}"
          else
            gh pr create --draft --base staging \
              --title "${title}" \
              --body "${body}"
          fi
