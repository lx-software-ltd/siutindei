name: Check Lockfiles

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter-lockfiles:
    name: Check Flutter lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Flutter lockfile
        uses: lx-software-ltd/actions/flutter-lockfiles@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          working-directory: apps/siutindei_app
          flutter-version: "3.47.9"

  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          node-version: "26"

      - name: Check Node lockfiles
        uses: lx-software-ltd/actions/node-lockfiles@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          directories: |
            apps/admin_web
            apps/public_www
            packages/react_ui
            packages/api_client_ts
            backend/infrastructure

  ios-lockfiles:
    name: Check iOS lockfiles
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Podfile.lock
        uses: lx-software-ltd/actions/pod-lockfiles@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          working-directory: apps/siutindei_app/ios

  python-requirements:
    name: Check Python requirements
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@61b67ed4f686659433f6ca4cb10c80707e365cd0 # main 2026-11-22
        with:
          files: |
            backend/requirements.txt
