name: board-merge-staging
run-name: board-merge-staging #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: board-merge-staging-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout policy helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Re-check policy and squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: bash scripts/board/merge-board-staging.sh
