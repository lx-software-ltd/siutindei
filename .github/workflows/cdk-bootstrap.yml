name: CDK Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdk-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@556b783f2eb716ed85e47b215d9e74ecf2cd14ce # main 2026-11-25
        with:
          cache: npm
          working-directory: backend/infrastructure
          install: "false"

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@556b783f2eb716ed85e47b215d9e74ecf2cd14ce # main 2026-11-25

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@556b783f2eb716ed85e47b215d9e74ecf2cd14ce # main 2026-11-25
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Bootstrap CDK
        uses: lx-software-ltd/actions/cdk-bootstrap@556b783f2eb716ed85e47b215d9e74ecf2cd14ce # main 2026-11-25
        with:
          working-directory: backend/infrastructure
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
