# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # GitHub Actions - keep CI secure and up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "infrastructure"
    groups:
      github-actions:
        patterns:
          - "*"

  # NPM - CDK infrastructure
  - package-ecosystem: "npm"
    directory: "/backend/infrastructure"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "infrastructure"
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates - review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # aws-cdk-lib 2.275.0 bundles minimatch 10.2.6 (inBundle).
      # GHSA-g3hv-75wg-m249 / CVE-2026-118764 is fixed only in 11.0.1+,
      # and security updates ignore the semver-major rule above.
      # Dependabot then fails with security_update_not_possible:
      # aws-cdk-lib requires ^10.2.6 and cannot rewrite the tarball
      # (jobs 1688359195 and 1688361605). Runtime is patched by
      # postinstall. Revisit when aws-cdk-lib bundles minimatch 11
      # (aws/aws-cdk#39595).
      - dependency-name: "minimatch"

  # NPM - public marketing site
  - package-ecosystem: "npm"
    directory: "/apps/public_www"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates - review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # extract-zip <=2.0.1 has no patched release (GHSA-jmr9-qjv8-65gv).
      # It is a dev-only transitive of @lhci/cli → lighthouse 12 →
      # puppeteer. Production `npm audit --omit=dev` is clean. Revisit
      # when @lhci/cli ships Lighthouse 13+ (puppeteer-core 25 /
      # @puppeteer/browsers 3, which dropped extract-zip).
      - dependency-name: "extract-zip"

  # NPM - admin console
  - package-ecosystem: "npm"
    directory: "/apps/admin_web"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates - review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python - Lambda backend
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "aws*"
      database:
        patterns:
          - "sqlalchemy*"
          - "alembic"
          - "psycopg*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "boto3"
          - "botocore"
          - "aws*"
          - "sqlalchemy*"
          - "alembic"
          - "psycopg*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # psycopg[binary] currently requires psycopg-binary releases that
      # lag behind psycopg minor versions, so only accept patch updates.
      - dependency-name: "psycopg"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "psycopg-binary"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Pub - Flutter mobile app
  - package-ecosystem: "pub"
    directory: "/apps/siutindei_app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "mobile"
    groups:
      flutter:
        patterns:
          - "flutter*"
          - "cupertino*"
      firebase:
        patterns:
          - "firebase*"
          - "cloud_firestore"
      amplify:
        patterns:
          - "amplify*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "flutter*"
          - "firebase*"
          - "amplify*"
        update-types:
          - "minor"
          - "patch"
