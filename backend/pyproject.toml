[project]
name = 'siutindei-backend'
version = '0.1.0'
description = 'Backend services and Lambda handlers'
requires-python = '>=3.12'

[project.optional-dependencies]
dev = [
  'pytest>=8.0',
  'pytest-cov>=5.0',
]

[tool.ruff]
line-length = 88
target-version = 'py312'
src = ['src', 'lambda']

[tool.ruff.lint]
select = [
  'E',
  'W',
  'F',
  'I',
  'UP',
  'B',
  'SIM',
  'C4',
  'PERF',
  'PLR0911',
  'PLR0912',
  'PLR0913',
  'PLR0915',
  'PLR0917',
]
# Keep TypeVar generics so pre-commit mypy 1.8 can read them.
ignore = ["UP046", "UP047"]

[tool.ruff.lint.pylint]
# Ceilings match the measured maxima in this tree (ruff 0.17).
max-args = 13
max-positional-args = 13
max-returns = 17
max-branches = 34
max-statements = 113

[tool.ruff.lint.per-file-ignores]
# Email HTML and historical SQL stay on one line.
"src/app/templates/*.py" = ["E501"]
# Historical revisions keep Union[str, None] so the revision contract matches.
"db/alembic/versions/*.py" = ["E501", "UP007"]

[tool.pytest.ini_options]
testpaths = ['../tests', 'tests']
python_files = ['test_*.py']
addopts = '-ra'

[tool.mypy]
python_version = '3.12'
strict = false
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = '(db/alembic/versions/|scripts/)'
