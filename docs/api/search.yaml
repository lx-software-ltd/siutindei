openapi: 3.0.3
info:
  title: Activities Search API
  version: 0.1.0
  description: |
    Search activities with filters for age, district, price, time, and language.

    ## Filter Validation Rules

    ### Numeric Ranges
    | Parameter | Range | Description |
    |-----------|-------|-------------|
    | age | >= 0 | Child's age to filter activities |
    | age_min | >= 0 | Youngest age of a wanted range |
    | age_max | >= 0 | Oldest age of a wanted range |
    | price_min | >= 0 | Minimum price filter |
    | price_max | >= 0 | Maximum price filter |
    | day_of_week_utc | 0-6 | Day of week (0=Sunday, 6=Saturday) |
    | start_minutes_utc | 0-1439 | Start time in minutes from midnight UTC |
    | end_minutes_utc | 0-1439 | End time in minutes from midnight UTC |
    | limit | 1-200 | Results per page (default 50) |

    ### Time Values
    Minutes are expressed as offset from midnight UTC:
    - 0 = 00:00 (midnight)
    - 60 = 01:00
    - 720 = 12:00 (noon)
    - 1439 = 23:59

    ### Filter Combinations
    - `start_minutes_utc` must be less than `end_minutes_utc` when both provided
    - `age` cannot be combined with `age_min` or `age_max`
    - `age_min` must be less than or equal to `age_max` when both provided

paths:
  /v1/activities/search:
    get:
      summary: Search activities
      description: |
        Search for activities matching the specified filters.
        Results are paginated and ordered by schedule time.
      security:
        - ApiKeyAuth: []
          DeviceAttestation: []
      parameters:
        - name: age
          in: query
          required: false
          description: |
            Filter activities suitable for this age (>= 0): the activity's
            age range contains it. Cannot be combined with `age_min` or
            `age_max`.
          schema:
            type: integer
            minimum: 0
        - name: age_min
          in: query
          required: false
          description: |
            Youngest age of the wanted range (>= 0). An activity matches
            when its age range overlaps `age_min` to `age_max`, so a class
            for ages 6 to 8 matches 6 to 11. Without `age_max` the range
            has no upper end.
          schema:
            type: integer
            minimum: 0
        - name: age_max
          in: query
          required: false
          description: |
            Oldest age of the wanted range (>= 0), inclusive. Without
            `age_min` the range starts at 0.
          schema:
            type: integer
            minimum: 0
        - name: kind
          in: query
          required: false
          description: |
            Listing kinds to return, comma-separated, for example
            `class,camp,place`. Repeating the parameter adds kinds.
            Omitted returns every kind, as before this parameter existed.
            An unknown kind is rejected.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ListingKind"
        - name: verified
          in: query
          required: false
          description: |
            When `true`, only activities of parent-verified organizations.
            `false` or omitted applies no filter.
          schema:
            type: boolean
            default: false
        - name: date_from
          in: query
          required: false
          description: |
            First day of the wanted dates, `YYYY-MM-DD` on the Hong Kong
            calendar. Keeps dated sessions that end on or after it.
            Weekly schedules with no dates always match. Sessions whose
            last day is before today in Hong Kong are never returned.
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: |
            Last day of the wanted dates, `YYYY-MM-DD` on the Hong Kong
            calendar, on or after `date_from`. Keeps dated sessions that
            start on or before it.
          schema:
            type: string
            format: date
        - name: area_id
          in: query
          required: false
          description: |
            Filter by geographic area UUID. Matches activities in the given area
            or any descendant area (for example a region, district, or neighbourhood).
          schema:
            type: string
            format: uuid
        - name: activity_id
          in: query
          required: false
          description: |
            Return results for a single activity UUID (at most one row).
            A direct lookup is not limited by `SEARCH_AREA_SCOPE`, so an
            activity page still opens when that activity sits outside the
            public area list.
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: false
          description: |
            Filter by activity category UUID. Multiple values allowed; results
            match any listed category or one of its descendants. Pending
            categorisation is excluded, and so is any category hidden from
            public (Schools, Members-only clubs, and whatever an admin
            hides), with everything under it, whether or not a category is
            given.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: pricing_type
          in: query
          required: false
          description: |
            Filter by pricing type:
            - per_class: Individual class pricing
            - per_sessions: Per term pricing
            - per_hour: Hourly pricing
            - per_day: Daily pricing
            - free: Free pricing
            - per_month: Monthly pricing
            - per_year: Yearly pricing
          schema:
            type: string
            enum: [per_class, per_sessions, per_hour, per_day, free, per_month, per_year]
        - name: price_min
          in: query
          required: false
          description: Minimum price filter (>= 0)
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: price_max
          in: query
          required: false
          description: Maximum price filter (>= 0)
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: schedule_type
          in: query
          required: false
          description: |
            Filter by schedule type:
            - weekly: Recurring weekly schedules
          schema:
            type: string
            enum: [weekly]
        - name: day_of_week_utc
          in: query
          required: false
          description: |
            Filter by day of week (0-6):
            0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday.
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: start_minutes_utc
          in: query
          required: false
          description: |
            Filter by start time (0-1439 minutes from midnight UTC).
            Example: 600 = 10:00 AM UTC.
            Must be less than end_minutes_utc when both provided.
          schema:
            type: integer
            minimum: 0
            maximum: 1439
        - name: end_minutes_utc
          in: query
          required: false
          description: |
            Filter by end time (0-1439 minutes from midnight UTC).
            Example: 1080 = 6:00 PM UTC.
            Must be greater than start_minutes_utc when both provided.
          schema:
            type: integer
            minimum: 0
            maximum: 1439
        - name: language
          in: query
          required: false
          description: |
            Filter by language (ISO 639-1 codes plus yue (ISO 639-3)). Multiple values allowed.
            Supported: en, zh, ja, ko, fr, de, es, pt, it, ru, ar, hi, th, vi, id, ms, tl, nl, pl, tr, yue
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [en, zh, ja, ko, fr, de, es, pt, it, ru, ar, hi, th, vi, id, ms, tl, nl, pl, tr, yue]
        - name: q
          in: query
          required: false
          description: |
            Case-insensitive match on activity name, organization name, and
            name translation values. Fewer than 2 characters is rejected.
            Longer than 100 characters is rejected.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: view
          in: query
          required: false
          description: |
            Response shape. `full` is the default and matches the existing
            payload. `card` omits descriptions, description translations,
            facts, place_id, contact, reviews, and updated_at, keeps only the
            first media URL and the first weekly entry, drops
            `name_translations.en` when it equals `name` (and
            `category_name_translations.en` when it equals
            `category_name`), and omits `kind` when it is `class`.
          schema:
            type: string
            enum: [card, full]
            default: full
        - name: include_incomplete
          in: query
          required: false
          description: |
            When `true`, also return activities of an approved
            organization that are missing a price, a schedule, or both.
            Those rows come after the complete rows, ordered by
            organization name, then activity name. The venue is one
            that matches the area, price, and schedule filters: a
            schedule venue, then a priced venue, then a linked venue.
            `pricing` and `schedule` are null when that piece is
            missing at the chosen venue. Omitted or `false` keeps
            today's results, and an incomplete-page cursor is ignored.
            Older clients should omit it.
          schema:
            type: boolean
            default: false
        - name: organization_id
          in: query
          required: false
          description: |
            Only activities of these organizations. Repeat the parameter
            for more than one. Used for "more from this organiser".
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: day_of_week_hkt
          in: query
          required: false
          description: |
            Only sessions that start on these days in Hong Kong time
            (UTC+8): 0=Sunday through 6=Saturday. Repeat the parameter
            for more than one, for example `0` and `6` for the weekend.
            A session stored as Friday 23:00 UTC starts on Saturday in
            Hong Kong and matches `6`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 6
        - name: free_trial
          in: query
          required: false
          description: When `true`, only prices that offer a free trial class.
          schema:
            type: boolean
            default: false
        - name: class_price_max
          in: query
          required: false
          description: |
            Highest price of one class (>= 0). Free is 0, `per_class` and
            `per_hour` are the amount, and `per_sessions` with a
            `sessions_count` is the amount divided by the count. Other
            prices have no per-class equivalent and are excluded.
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: sort
          in: query
          required: false
          description: |
            `time` (default) orders by the first session day and time in
            UTC. `price` orders by the per-class price described under
            `class_price_max`, cheapest first, with rows that have no
            per-class price after every priced row, then by time. A
            cursor only continues the sort it was issued for; another
            sort returns 400. Incomplete rows always come last.
          schema:
            type: string
            enum: [time, price]
            default: time
        - name: include_total
          in: query
          required: false
          description: |
            When `true`, the first page carries `total`: the number of
            distinct activities that match across every page. Pages
            fetched with `cursor` omit it.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Maximum results per page (1-200, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from previous response's next_cursor field
          schema:
            type: string
      responses:
        "200":
          description: Search results
          headers:
            Cache-Control:
              description: |
                `public, max-age=60, s-maxage=300`. Results are public and
                shared by every caller, so the public-website CloudFront
                behavior caches them for up to 5 minutes. Error responses
                and partner search send `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySearchResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/listing-events:
    post:
      summary: Ingest first-party listing funnel events
      description: |
        Record search, listing view, CTA tap, and lead events used to
        fill `listing_events_daily` / `v_funnel_daily`. This is first-party
        product telemetry (location-grained). The Executive Board already
        reads GA4 via its `web` tools; do not send page titles, search
        terms, or other PII here.
      security:
        - ApiKeyAuth: []
          DeviceAttestation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingEventIngestRequest"
      responses:
        "204":
          description: Events accepted (duplicates of client_event_id ignored)
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    DeviceAttestation:
      type: apiKey
      in: header
      name: x-device-attestation
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
    ListingEventIngestRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/ListingEvent"
    ListingEvent:
      type: object
      required: [event_type, source]
      properties:
        event_type:
          type: string
          enum: [search, listing_view, cta_tap, lead_relayed]
        source:
          type: string
          enum: [public_www, flutter, partner]
        location_id:
          type: string
          format: uuid
          description: |
            Venue UUID. Omit for unattributed events (searches, site-wide
            CTAs); the server stores the nil UUID.
        activity_id:
          type: string
          format: uuid
        client_event_id:
          type: string
          maxLength: 128
          description: Client-generated idempotency key.
    ActivitySearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivitySearchResult"
        next_cursor:
          type: string
          nullable: true
        category_match:
          type: string
          enum: [exact, legacy_fallback]
          description: |
            `legacy_fallback` means every requested category is a wizard
            group that still has no activities on its leaves, so the
            results also include activities on the legacy roots. The
            match becomes `exact` once any activity sits on that group
            or one of its leaves. When `SEARCH_AREA_SCOPE` is set, only
            activities with a schedule in that scope count.
        area_scope:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: |
            Neighbourhood ids the deployment limits public search to.
            Present on the first page only. Null when `SEARCH_AREA_SCOPE`
            is unset, which leaves search unrestricted. An empty array
            means the variable is set but names no neighbourhood, so
            public search returns nothing. A request that passes `cursor`
            omits this field; clients keep the list from the first page.
            The list is informational on `activity_id` lookups and on
            partner search: those requests are not filtered by it.
        total:
          type: integer
          minimum: 0
          description: |
            Distinct matching activities across every page. Present only
            on the first page of a request with `include_total=true`.
    ActivitySearchResult:
      type: object
      required: [activity, organization, location, pricing, schedule]
      properties:
        activity:
          $ref: "#/components/schemas/Activity"
        organization:
          $ref: "#/components/schemas/Organization"
        location:
          $ref: "#/components/schemas/Location"
        pricing:
          nullable: true
          description: |
            Null when `include_incomplete=true` and the activity has no
            price at the chosen venue.
          allOf:
            - $ref: "#/components/schemas/Pricing"
        schedule:
          nullable: true
          description: |
            Null when `include_incomplete=true` and the activity has no
            schedule at the chosen venue.
          allOf:
            - $ref: "#/components/schemas/Schedule"
    Organization:
      type: object
      required:
        - id
        - name
        - name_translations
        - media_urls
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        name_translations:
          $ref: "#/components/schemas/TranslationMap"
        description_translations:
          $ref: "#/components/schemas/TranslationMap"
        media_urls:
          type: array
          items:
            type: string
        logo_media_url:
          type: string
          format: uri
          nullable: true
          description: Optional logo media URL.
        status:
          type: string
          nullable: true
          enum:
            - operational
            - closed_temporarily
          description: |
            Public listing status. `closed_permanently` and `hidden`
            organizations are excluded from search. Use this for a
            temporarily-closed badge.
        description_source:
          type: string
          nullable: true
          enum: [template, official, places, enrich]
          description: |
            When `template`, public descriptions are omitted if they are blank
            or still import filler (`for children and families` / `適合小朋友同家庭`).
            Unique copy with a stale `template` tag is shown. Filler
            translations are omitted even when the English text is unique.
        place_id:
          type: string
          nullable: true
          description: |
            Google Places id. Set only when searching by `activity_id`
            (listing detail) so the app can deep-link to Google Maps. Other
            full-view results send `null`; `view=card` omits the field.
        parent_verified:
          type: boolean
          default: false
          description: |
            Set by an admin. Clients show a Parent-Verified badge when
            true. `view=card` omits the field when false.
        parent_verified_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When a parent last checked this organization. Null when it is
            not verified, or when it was verified before the date was
            recorded. `view=card` omits the field when null.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last change to the organization. `view=card` omits it.
        contact:
          nullable: true
          description: Public contact details. `view=card` omits it.
          allOf:
            - $ref: "#/components/schemas/OrganizationContact"
        rating:
          nullable: true
          description: |
            Approved parent feedback for the organization. Null when it
            has none. `view=card` omits the field when null.
          allOf:
            - $ref: "#/components/schemas/FeedbackRating"
        reviews:
          type: array
          description: |
            Up to 20 newest approved feedback entries, filled only when
            searching by `activity_id`. Other full-view results send an
            empty list; `view=card` omits the field. Submitter details
            are never included.
          items:
            $ref: "#/components/schemas/FeedbackReview"
    OrganizationContact:
      type: object
      description: |
        Social fields hold a handle or a URL, as entered in the admin
        console. Clients turn a handle into a profile link.
      properties:
        website:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone_country_code:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country of `phone_number`.
        phone_number:
          type: string
          nullable: true
          description: National number digits, without the country code.
        whatsapp:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        tiktok:
          type: string
          nullable: true
        twitter:
          type: string
          nullable: true
        xiaohongshu:
          type: string
          nullable: true
        wechat:
          type: string
          nullable: true
    FeedbackRating:
      type: object
      required: [count, average_stars]
      properties:
        count:
          type: integer
          minimum: 1
        average_stars:
          type: number
          description: Mean of 0-5 stars, one decimal place.
    FeedbackReview:
      type: object
      required: [id, stars, labels, created_at]
      properties:
        id:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 0
          maximum: 5
        description:
          type: string
          nullable: true
        labels:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              name_translations:
                $ref: "#/components/schemas/TranslationMap"
        created_at:
          type: string
          format: date-time
    Location:
      type: object
      required: [id, area_id]
      properties:
        id:
          type: string
          format: uuid
        area_id:
          type: string
          format: uuid
          description: |
            Leaf area UUID. A neighbourhood in Hong Kong, or a district
            that has no smaller areas.
        region_area_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Macro-region ancestor UUID (for example Hong Kong Island) when the
            location district belongs to a region node.
        name:
          type: string
          nullable: true
          description: |
            Venue label, such as a studio or campus name. `view=card` omits
            the field when null.
        address:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        status:
          type: string
          enum: [open, temporarily_closed, permanently_closed]
          description: |
            Venue status. `permanently_closed` locations are excluded
            from search. `temporarily_closed` stays in the results so
            clients can show the same badge as a temporarily closed
            organization.
    Activity:
      type: object
      required: [id, name, name_translations]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        name_translations:
          $ref: "#/components/schemas/TranslationMap"
        description_translations:
          $ref: "#/components/schemas/TranslationMap"
        age_min:
          type: integer
          nullable: true
        age_max:
          type: integer
          nullable: true
        category_id:
          type: string
          format: uuid
          description: Activity category UUID
        kind:
          allOf:
            - $ref: "#/components/schemas/ListingKind"
          default: class
          description: |
            What the listing is, which decides what its card shows.
            `view=card` omits the field when it is `class`; clients read a
            missing kind as `class`.
        facts:
          type: object
          additionalProperties:
            type: boolean
          description: |
            Parent-checked facts. `true` means a parent saw it, `false`
            that a parent saw it is missing, and an absent key that nobody
            checked. The keys depend on `kind`. `view=card` omits the field.
        category_root_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The root at the top of the category's path: a wizard topic, a
            fixed root such as Places to play, or a legacy root. Equals
            `category_id` when the activity sits on a root. `view=card`
            omits the field when null.
        category_name:
          type: string
          nullable: true
          description: |
            English name of the activity's own category. `view=card`
            omits the field when null.
        category_name_translations:
          $ref: "#/components/schemas/TranslationMap"
    ListingKind:
      type: string
      enum: [class, camp, place, preschool, eat]
      description: |
        `class` runs every week, `camp` has dates, `place` is somewhere to
        turn up, `preschool` is a nursery or kindergarten, and `eat` is a
        place to eat with children.
    Pricing:
      type: object
      required: [pricing_type, amount, currency, free_trial_class_offered]
      properties:
        pricing_type:
          type: string
          enum: [per_class, per_sessions, per_hour, per_day, free, per_month, per_year]
        amount:
          type: number
        currency:
          type: string
          description: ISO 4217 currency code (case-insensitive)
        sessions_count:
          type: integer
          nullable: true
        free_trial_class_offered:
          type: boolean
          description: Whether a free trial class is offered
    WeeklyScheduleEntry:
      type: object
      required: [day_of_week_utc, start_minutes_utc, end_minutes_utc]
      properties:
        day_of_week_utc:
          type: integer
          minimum: 0
          maximum: 6
        start_minutes_utc:
          type: integer
          minimum: 0
          maximum: 1439
        end_minutes_utc:
          type: integer
          minimum: 0
          maximum: 1439
    Schedule:
      type: object
      required: [schedule_type, weekly_entries, languages]
      properties:
        schedule_type:
          type: string
          enum: [weekly]
        weekly_entries:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyScheduleEntry"
        languages:
          type: array
          items:
            type: string
        starts_on:
          type: string
          format: date
          nullable: true
          description: |
            First day of a dated session such as a camp week, Hong Kong
            calendar. Null for a weekly schedule. `view=card` omits it
            when null.
        ends_on:
          type: string
          format: date
          nullable: true
          description: Last day of a dated session. Null for a weekly schedule.
    TranslationMap:
      type: object
      additionalProperties:
        type: string
      description: |
        Language map for translated text. The full view always includes English as "en";
        `view=card` omits "en" from name translations when it equals `name`.
        Additional entries must use ISO 639-1 codes plus "yue" (Cantonese, ISO 639-3).
