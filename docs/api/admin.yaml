  /v1/admin/category-suggestions/scan:
    get:
      summary: List recent category-check runs
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryScanRun'
    post:
      summary: Sweep activity categories and store reviews
      description: |
        Admin group only. Selects activities in `review_scope`,
        skipping ones confirmed, applied, or auto-applied in the last
        30 days unless `rescan` is true. `pending_review` limits the
        run to organizations still in review. `all` includes approved
        organizations. Auto-assign still applies only while the
        organization is `pending_review`. Returns 202 with the run.
        An empty selection is a finished run with zero batches. 409
        when a run is already queued or running.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryScanRequest'
      responses:
        "202":
          description: Run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryScanRun'
        "409":
          description: A category check is already running
        "502":
          description: The run could not be queued

  /v1/admin/category-suggestions/scan/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read one category-check run
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryScanRun'
        "404":
          description: Run not found

