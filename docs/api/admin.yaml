  # --- Geographic Areas Management (Admin Only) ---

  /v1/admin/areas:
    get:
      summary: List all geographic areas
      description: |
        Returns the full geographic area tree including inactive countries.
        Admin-only endpoint for managing area activation.
      responses:
        "200":
          description: Full area tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaTreeResponse'

  /v1/admin/areas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Toggle area active status
      description: |
        Activate or deactivate a geographic area (typically a country).
        When a country is deactivated, it and its children are hidden
        from user-facing endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
                  description: New active state
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeographicArea'
        "404":
          description: Area not found

  # --- User Routes (Any Authenticated User) ---

  /v1/user/address-search:
    get:
      summary: Address autocomplete
      description: |
        Proxy to Nominatim for address autocomplete suggestions.
      security:
        - UserAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (min 3 characters)
          schema:
            type: string
            minLength: 3
            maxLength: 500
        - name: countrycodes
          in: query
          required: false
          description: Comma-separated ISO 3166-1 alpha-2 codes
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum suggestions (1-10, default 5)
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Address suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSearchResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "502":
          description: Upstream address provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/user/areas:
    get:
      summary: List active geographic areas
      description: |
        Returns the geographic area tree for active countries only.
        Used by frontend for cascading country/district dropdowns.
      responses:
        "200":
          description: Active area tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaTreeResponse'

  /v1/user/activity-categories:
    get:
      summary: List activity categories
      description: |
        Returns the activity category tree for use in selection UIs.
        Available to any authenticated user.
      responses:
        "200":
          description: Activity category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCategoryTreeResponse'

  /v1/user/access-request:
    get:
      summary: Check access request status
      description: |
        Check if the authenticated user has a pending manager access request
        and get their managed organizations count.
      responses:
        "200":
          description: User's access request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_pending_request:
                    type: boolean
                  pending_request:
                    $ref: '#/components/schemas/Ticket'
                    nullable: true
                  organizations_count:
                    type: integer
                    description: Number of organizations the user manages
    post:
      summary: Submit access request
      description: |
        Submit a request to become a manager of an organization.
        Only one pending request per user is allowed.
        Request is published to SNS for async processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
      responses:
        "202":
          description: Request submitted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ticket_id:
                    type: string
                    description: Unique ticket ID (e.g., R00001)
        "409":
          description: User already has a pending access request

  /v1/user/organization-suggestion:
    get:
      summary: Get suggestion history
      description: |
        Get the authenticated user's organization suggestion history
        and check if they have a pending suggestion.
      responses:
        "200":
          description: User's suggestion history
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_pending_suggestion:
                    type: boolean
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
    post:
      summary: Submit organization suggestion
      description: |
        Suggest a new organization/place for the platform.
        Any authenticated user can submit suggestions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSuggestionCreate'
      responses:
        "202":
          description: Suggestion submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ticket_id:
                    type: string
                    description: Unique ticket ID (e.g., S00001)
        "409":
          description: User already has a pending suggestion

  /v1/user/feedback-labels:
    get:
      summary: List feedback labels
      description: Retrieve feedback labels for user selection.
      responses:
        "200":
          description: List of feedback labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackLabelListResponse'

  /v1/user/organization-feedback:
    get:
      summary: Get feedback history
      description: |
        Get the authenticated user's feedback history and check
        for pending submissions.
      responses:
        "200":
          description: User feedback history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFeedbackResponse'
    post:
      summary: Submit organization feedback
      description: |
        Submit feedback for an organization. Only one pending
        feedback submission is allowed at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeedbackCreate'
      responses:
        "202":
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  ticket_id:
                    type: string
        "409":
          description: User already has a pending feedback submission

  /v1/user/organizations:
    get:
      summary: Search organizations
      description: Search organizations by name for feedback selection.
      parameters:
        - name: q
          in: query
          required: false
          description: Search query string
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Organization matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLookupListResponse'

  # --- Health Check ---

  /health:
    get:
      summary: Health check
      description: |
        Service health check endpoint. Returns overall health status,
        including database connectivity and configuration checks.
        Requires IAM authentication.
      security:
        - IAMAuth: []
      parameters:
        - name: details
          in: query
          required: false
          description: Set to 'true' to include detailed check information
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:
  securitySchemes:
    AdminGroupAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token, user must be in 'admin' group
    ImporterGroupAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito JWT token, user must be in the 'importer' or 'admin' group.
        Allowed only on POST /v1/admin/imports and POST /v1/admin/imports/presign.
        The importer app client enables ALLOW_ADMIN_USER_PASSWORD_AUTH for
        AdminInitiateAuth (board catalog import).
    ManagerGroupAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token, user must be in 'admin' or 'manager' group
    UserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token, any authenticated user
    IAMAuth:
      type: apiKey
      in: header
      name: Authorization
      description: AWS IAM Signature V4
  schemas:
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message
        detail:
          type: string
          description: Additional details (e.g., field name)

    TranslationMap:
      type: object
      additionalProperties:
        type: string
      description: |
        Language map for translated text. The server always includes English as "en".
        Additional entries must use ISO 639-1 codes plus "yue" (Cantonese, ISO 639-3).

    AdminImportFile:
      type: object
      required: [organizations]
      properties:
        default_manager_id:
          type: string
          format: uuid
          description: |
            Applied to any organization that omits manager_id. Must be a UUID.
            Used only to satisfy the create-time manager_id requirement.
            It does not reassign an existing organization's manager.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportOrganization'

    AdminImportOrganization:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: Organization name (unique).
        description:
          type: string
          maxLength: 5000
          description: |
            Organization description. Source URL and notes are stored
            on source_url and source_note and are not appended here.
        name_translations:
          $ref: '#/components/schemas/TranslationMap'
        description_translations:
          $ref: '#/components/schemas/TranslationMap'
        manager_id:
          type: string
          description: |
            Cognito user sub. Required on create unless default_manager_id
            is set at the file root. On update, a matching manager_id is
            ignored; a different value fails the record with
            `manager_id cannot be changed on update`. Import never writes
            manager_id on update. Importer-only callers skip a matching
            manager_id org (compared case-insensitively; children still
            import) and still fail a foreign name match with `exists`.
        source_url:
          type: string
          maxLength: 400
          description: Stored on the organization. Not appended to description.
        source_note:
          type: string
          maxLength: 500
          description: |
            Stored on the organization. Wins over vetting_note when both
            are set. Catalog key=value pairs are removed before storage.
        vetting_note:
          type: string
          maxLength: 500
          description: |
            Import-only. `source=`, `sourceId=`, and `descriptionSource=`
            pairs fill those columns. The remaining text is stored as
            source_note when source_note is empty.
        source:
          type: string
          enum: [lcsd, edb, swd, places, competitor]
        source_id:
          type: string
          maxLength: 80
        description_source:
          type: string
          enum: [template, official, places, enrich]
        review_status:
          type: string
          description: |
            Ignored and omitted from export. A warning is recorded when the
            supplied value is not the organization's current review state,
            including organizations that do not exist yet. New imported
            organizations are stored as `pending_review`. Updates keep the
            current review state.
        review_notes:
          type: string
          description: |
            Included on export for visibility and ignored on import.
        area_name:
          type: string
          description: |
            Board-flat org field. When locations[] is empty, the importer
            synthesizes one location resolved like location area_name.
            Ignored with a warning when locations[] is already present.
        category_name:
          type: string
          description: |
            Board-flat org field. When activities[] is empty, the importer
            synthesizes one activity with default ages 0–18 (intended
            product default for catalog venues) resolved like activity
            category_name. Ignored with a warning when activities[] is
            already present.
        address:
          type: string
          description: Board-flat org field used as the synthesized location name.
        lat:
          type: number
        lng:
          type: number
        website:
          type: string
          description: |
            Accepted on board-flat orgs and recorded as a warning;
            not stored on the organization.
        phone:
          type: string
          description: |
            Board-flat org field. An 8-digit HK number is mapped to
            phone_country_code=HK and phone_number.
        name_zh:
          type: string
          maxLength: 200
          description: |
            Optional Traditional Chinese name; blank is ignored.
            Mapped onto name_translations.zh (ISO 639-1), not zh-HK.
        description_zh:
          type: string
          maxLength: 400
          description: |
            Optional Traditional Chinese description; blank is ignored.
            Mapped onto description_translations.zh (ISO 639-1),
            not zh-HK. Nested activities inherit this value.
        place_id:
          type: string
          maxLength: 255
          description: |
            Google Places id. Matched before manager_id + name. A place_id
            match with a different name updates the organization.
        status:
          type: string
          enum:
            - operational
            - closed_temporarily
            - closed_permanently
            - hidden
          description: |
            Listing status. `closed_permanently` updates an existing match
            and does not create when no match exists. Provider-owned rows
            are skipped with `managed by provider`.
        phone_country_code:
          type: string
          maxLength: 2
        phone_number:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 320
        whatsapp:
          type: string
          maxLength: 2048
        facebook:
          type: string
          maxLength: 2048
        instagram:
          type: string
          maxLength: 2048
        tiktok:
          type: string
          maxLength: 2048
        twitter:
          type: string
          maxLength: 2048
        xiaohongshu:
          type: string
          maxLength: 2048
        wechat:
          type: string
          maxLength: 2048
        media_urls:
          type: array
          items:
            type: string
        logo_media_url:
          type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportLocation'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportActivity'

    AdminImportLocation:
      type: object
      required: [name, area_id]
      properties:
        name:
          type: string
          maxLength: 500
          description: |
            Location name used for upsert. Stored as address in the database and
            must be unique within the organization.
        address:
          type: string
          maxLength: 500
          description: Optional address (must match name if provided).
        area_id:
          type: string
          format: uuid
        area_name:
          type: string
          description: |
            Alternative to area_id. Resolved by exact match on a leaf
            geographic_areas.name. In Hong Kong that is a neighbourhood.
            A district name matches only when it has no neighbourhoods.
            area_id wins when both are set.
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    AdminImportActivity:
      type: object
      required: [name, category_id, age_min, age_max]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          description: |
            Activity description. Source URL and notes are stored on
            source_url and source_note and are not appended here.
        name_translations:
          $ref: '#/components/schemas/TranslationMap'
        description_translations:
          $ref: '#/components/schemas/TranslationMap'
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
          description: |
            Alternative to category_id. Resolved by exact match on
            activity_categories.name. category_id wins when both are set.
        source_url:
          type: string
          maxLength: 400
          description: Stored on the activity. Not appended to description.
        source_note:
          type: string
          maxLength: 500
          description: |
            Stored on the activity. Wins over vetting_note when both
            are set.
        vetting_note:
          type: string
          maxLength: 500
          description: |
            Import-only. Catalog key=value pairs are removed and the
            remaining text is stored as source_note when source_note
            is empty.
        age_min:
          type: integer
          minimum: 0
          maximum: 119
        age_max:
          type: integer
          minimum: 1
          maximum: 120
        pricing:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportPricing'
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportSchedule'

    AdminImportPricing:
      type: object
      required: [location_name, pricing_type]
      properties:
        location_name:
          type: string
          description: Location name to link pricing with.
        pricing_type:
          type: string
          enum: [per_class, per_sessions, per_hour, per_day, free]
        amount:
          type: number
          minimum: 0
        currency:
          type: string
        sessions_count:
          type: integer
          minimum: 1
        free_trial_class_offered:
          type: boolean

    AdminImportSchedule:
      type: object
      required: [location_name, timezone, weekly_entries]
      properties:
        location_name:
          type: string
        timezone:
          type: string
          description: IANA timezone identifier (e.g., Asia/Hong_Kong).
        languages:
          type: array
          items:
            type: string
        weekly_entries:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportScheduleEntry'

    AdminImportScheduleEntry:
      type: object
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Local day of week (0=Sunday).
        start_time:
          type: string
          description: Local start time in HH:MM.
        end_time:
          type: string
          description: Local end time in HH:MM.

    AdminImportPresignRequest:
      type: object
      required: [file_name, content_type]
      properties:
        file_name:
          type: string
          description: Filename ending in .json.
        content_type:
          type: string
          description: Must be application/json.

    AdminImportPresignResponse:
      type: object
      required: [upload_url, object_key, expires_in]
      properties:
        upload_url:
          type: string
        object_key:
          type: string
        expires_in:
          type: integer

    AdminImportRequest:
      type: object
      required: [object_key]
      properties:
        object_key:
          type: string
          description: S3 object key returned from the presign endpoint.
        dry_run:
          type: boolean
          default: false
          description: |
            When true, validate and report results without committing
            creates or updates, and without persisting audit_log rows.
            CloudWatch uses a distinct "dry-run completed" line. Same
            presign + PUT flow as a live import.
        retry_failed:
          type: boolean
          default: false
          description: |
            When true on a completed live import, rerun only organizations
            whose stored result failed and merge those rows back. A job
            whose status is failed is rerun as a whole. Cannot be combined
            with dry_run.

    AdminImportCounts:
      type: object
      required: [created, updated, failed, skipped]
      properties:
        created:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer

    AdminImportSummary:
      type: object
      required:
        - organizations
        - locations
        - activities
        - pricing
        - schedules
        - warnings
        - errors
      properties:
        organizations:
          $ref: '#/components/schemas/AdminImportCounts'
        locations:
          $ref: '#/components/schemas/AdminImportCounts'
        activities:
          $ref: '#/components/schemas/AdminImportCounts'
        pricing:
          $ref: '#/components/schemas/AdminImportCounts'
        schedules:
          $ref: '#/components/schemas/AdminImportCounts'
        warnings:
          type: integer
        errors:
          type: integer
        captured_categories:
          type: integer
          description: |
            Distinct category suggestions touched by this import.
            Omitted on jobs stored before capture existed.
        captured_category_ids:
          type: array
          items:
            type: string
          description: |
            Suggestion ids counted by captured_categories. A retry
            unions this list with the previous job so one label is
            not counted twice. Omitted on jobs stored before the list
            existed.

    AdminImportError:
      type: object
      required: [message]
      properties:
        message:
          type: string
        field:
          type: string
          nullable: true

    AdminImportResult:
      type: object
      required: [type, key, status, warnings, errors]
      properties:
        type:
          type: string
          enum: [organizations, locations, activities, pricing, schedules]
        key:
          type: string
        status:
          type: string
          enum: [created, updated, failed, skipped]
        id:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportError'
        error:
          type: string
          description: First error message, for the bulk catalog caller.
        place_id:
          type: string
          description: Echoed on organization results when sent.

    AdminImportResponse:
      type: object
      required: [summary, results, file_warnings]
      properties:
        id:
          type: string
          format: uuid
          description: Stored import job id for later GET.
        object_key:
          type: string
        summary:
          $ref: '#/components/schemas/AdminImportSummary'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportResult'
        file_warnings:
          type: array
          items:
            type: string
        dry_run:
          type: boolean
          description: Echo of the request dry_run flag.

    AdminImportJob:
      type: object
      required:
        - id
        - object_key
        - dry_run
        - summary
        - results
        - file_warnings
      properties:
        id:
          type: string
          format: uuid
        object_key:
          type: string
        dry_run:
          type: boolean
        summary:
          $ref: '#/components/schemas/AdminImportSummary'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportResult'
        file_warnings:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [running, completed, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminImportJobListItem:
      type: object
      required: [id, object_key, dry_run, status, summary, file_warnings]
      properties:
        id:
          type: string
          format: uuid
        object_key:
          type: string
        dry_run:
          type: boolean
        status:
          type: string
          enum: [running, completed, failed]
        summary:
          $ref: '#/components/schemas/AdminImportSummary'
        file_warnings:
          type: array
          items:
            type: string
        result_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminImportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminImportJobListItem'
        next_cursor:
          type: string
          nullable: true

    OrgReviewIssue:
      type: object
      required: [code, severity, entity_type, entity_id, message]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [blocker, warning]
        entity_type:
          type: string
          enum: [organization, location, activity]
        entity_id:
          type: string
        message:
          type: string

    OrgReviewListItem:
      type: object
      required: [id, name, status, review_status, issues, completeness]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        review_status:
          type: string
          enum: [pending_review, approved, rejected]
        source:
          type: string
          nullable: true
        status_source:
          type: string
          nullable: true
        description_source:
          type: string
          nullable: true
        import_job_id:
          type: string
          format: uuid
          nullable: true
        last_imported_at:
          type: string
          format: date-time
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          nullable: true
        place_id:
          type: string
          nullable: true
        manager_id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        location_count:
          type: integer
        activity_count:
          type: integer
        pricing_count:
          type: integer
        schedule_count:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/OrgReviewIssue'
        completeness:
          type: number
        blocker_count:
          type: integer
        warning_count:
          type: integer

    OrgReviewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrgReviewListItem'
        next_cursor:
          type: string
          nullable: true

    OrgReviewDetail:
      allOf:
        - $ref: '#/components/schemas/OrgReviewListItem'
        - type: object
          properties:
            organization:
              $ref: '#/components/schemas/Organization'
            locations:
              type: array
              items:
                $ref: '#/components/schemas/Location'
            activities:
              type: array
              items:
                $ref: '#/components/schemas/Activity'

    OrgReviewSummary:
      type: object
      required: [total, by_review_status, by_source, by_status_source, by_issue, with_blockers]
      properties:
        total:
          type: integer
        by_review_status:
          type: object
          additionalProperties:
            type: integer
        by_source:
          type: object
          additionalProperties:
            type: integer
        by_status_source:
          type: object
          additionalProperties:
            type: integer
        by_issue:
          type: object
          additionalProperties:
            type: integer
        with_blockers:
          type: integer

    OrgReviewDecisionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, reopen]
        force:
          type: boolean
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [operational, closed_temporarily, closed_permanently, hidden]

    OrgReviewBulkRequest:
      type: object
      required: [org_ids, action]
      properties:
        org_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        action:
          type: string
          enum: [approve, reject, reopen, set_fields]
        force:
          type: boolean
        notes:
          type: string
          nullable: true
        status:
          type: string
        fields:
          type: object
          description: |
            Whitelist for `set_fields`: status, manager_id, source,
            source_url, source_note, description_source, review_notes,
            phone fields, email, and social fields. Only supplied keys
            are written.
          additionalProperties: true

    OrgReviewBulkResult:
      type: object
      required: [org_id, status]
      properties:
        org_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ok, blocked, error]
        review_status:
          type: string
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/OrgReviewIssue'

    OrgReviewBulkResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrgReviewBulkResult'

    AdminExportResponse:
      type: object
      required: [download_url, object_key, file_name, expires_in]
      properties:
        download_url:
          type: string
        object_key:
          type: string
        file_name:
          type: string
        expires_in:
          type: integer
        warnings:
          type: array
          items:
            type: string

    # Organization schemas
