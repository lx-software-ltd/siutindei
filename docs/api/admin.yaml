    # Schedule schemas
    WeeklyScheduleEntry:
      type: object
      required:
        - day_of_week_utc
        - start_minutes_utc
        - end_minutes_utc
      properties:
        day_of_week_utc:
          type: integer
          minimum: 0
          maximum: 6
          description: |
            Day of week in UTC:
            0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday
        start_minutes_utc:
          type: integer
          minimum: 0
          maximum: 1439
          description: |
            Start time in minutes from midnight UTC.
            Range: 0-1439 (0 = 00:00, 1439 = 23:59).
            Must not equal end_minutes_utc.
            If start_minutes_utc > end_minutes_utc, the schedule spans
            midnight UTC into the next day.
        end_minutes_utc:
          type: integer
          minimum: 0
          maximum: 1439
          description: |
            End time in minutes from midnight UTC.
            Range: 0-1439 (0 = 00:00, 1439 = 23:59).
            Must not equal start_minutes_utc.

    ScheduleCreate:
      type: object
      required:
        - activity_id
        - location_id
        - schedule_type
        - weekly_entries
      properties:
        activity_id:
          type: string
          format: uuid
          description: Activity UUID (required)
        location_id:
          type: string
          format: uuid
          description: Location UUID (required)
        schedule_type:
          type: string
          enum: [weekly]
          description: |
            Schedule type (required, weekly only).
        weekly_entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeeklyScheduleEntry'
          description: Weekly schedule entries (required).
        languages:
          type: array
          maxItems: 20
          items:
            type: string
            enum: [en, zh, ja, ko, fr, de, es, pt, it, ru, ar, hi, th, vi, id, ms, tl, nl, pl, tr, yue]
          description: |
            ISO 639-1 language codes plus "yue" (Cantonese, ISO 639-3)
            (optional, max 20).
            Supported: en (English), zh (Chinese), ja (Japanese), ko (Korean),
            fr (French), de (German), es (Spanish), pt (Portuguese), it (Italian),
            ru (Russian), ar (Arabic), hi (Hindi), th (Thai), vi (Vietnamese),
            id (Indonesian), ms (Malay), tl (Tagalog), nl (Dutch), pl (Polish),
            tr (Turkish), yue (Cantonese)

    ScheduleUpdate:
      type: object
      properties:
