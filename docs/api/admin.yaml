    get:
      summary: List category-check reviews
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmed, pending, auto_applied, applied, dismissed, reverted]
        - name: verdict
          in: query
          schema:
            type: string
            enum: [confirm, reassign, propose]
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: scan_run_id
          in: query
          schema:
            type: string
            format: uuid
        - name: proposed_category_id
          in: query
          schema:
            type: string
            format: uuid
          description: >
            Limit reviews to one proposed category, for a bulk apply
            or dismiss of that leaf.
        - name: q
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Review page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCategoryReviewListResponse'

  /v1/admin/category-suggestions/reviews/bulk:
    post:
      summary: Apply or dismiss matching pending category-check reviews
      description: |
        One page of pending reviews that match the filters. `dry_run`
        counts the full match and writes nothing. Otherwise the server
        decides up to 100 reviews and returns `next_cursor` when more
        remain. Skipped rows still advance the cursor. Apply skips a
        pending confirm of Pending categorisation and a proposal that
        has no category yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryReviewBulkRequest'
      responses:
        "200":
          description: Page of bulk decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryReviewBulkResponse'
        "400":
          description: Invalid bulk request

  /v1/admin/category-suggestions/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read one category-check review
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCategoryReview'
        "404":
          description: Review not found
    post:
      summary: Apply, dismiss, or revert a category-check review
      description: |
        Apply assigns `category_id` when the body or the review has one,
        and confirms a correct current category when the verdict is
        confirm. Dismiss leaves the category unchanged. Revert restores
        `previous_category_id` for an applied or auto-applied review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCategoryReviewDecision'
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCategoryReview'
        "400":
          description: Invalid decision
        "404":
          description: Review not found

