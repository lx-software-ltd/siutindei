        - name: status
          in: query
          required: false
          description: Filter by ticket status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
