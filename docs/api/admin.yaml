          additionalProperties: true
        created_category_id:
          type: string
          format: uuid
          nullable: true
        merged_into_category_id:
          type: string
          format: uuid
          nullable: true
        decided_by:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        decision_notes:
          type: string
          nullable: true
        activity_count:
          type: integer
        reopened_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    CategorySuggestionActivityLink:
      type: object
      required: [activity_id, org_id, requested_name]
      properties:
        activity_id:
          type: string
          format: uuid
        activity_name:
          type: string
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        import_job_id:
          type: string
          format: uuid
          nullable: true
        requested_name:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true

    CategorySuggestionDetail:
      allOf:
        - $ref: '#/components/schemas/CategorySuggestion'
        - type: object
          properties:
            activities:
              type: array
              items:
                $ref: '#/components/schemas/CategorySuggestionActivityLink'

    CategorySuggestionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySuggestion'
        next_cursor:
          type: string
          nullable: true

    CategorySuggestionSummary:
      type: object
      required:
        - by_status
        - by_enrichment_status
        - pending_activity_total
        - stranded_activity_total
        - month_cost_usd
      properties:
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_enrichment_status:
          type: object
          additionalProperties:
            type: integer
        pending_activity_total:
          type: integer
        stranded_activity_total:
          type: integer
          description: >-
            Activities still on Pending categorisation whose suggestion is
            no longer pending, usually a reject without a map target.
        review_pending_total:
          type: integer
        auto_applied_total:
          type: integer
        scan_candidate_total:
          type: integer
          description: >-
            Activities a `review_scope=pending_review` scan would
            check. Optional query org_id limits the count to one
            organization. The count is not capped.
        scan_candidate_total_all:
          type: integer
          description: >-
            Activities a `review_scope=all` scan would check. Optional
            query org_id still limits the count to one organization.
        scan_limit:
          type: integer
          description: Maximum activities one run will enqueue.
        scan_batch_size:
          type: integer
          description: >-
            Default number of activities or labels in one model call.
            A request can still pass a different batch_size.
        discover_activity_total:
          type: integer
          description: >-
            Activities still on Pending categorisation, in a
            pending-review organization, that carry an imported label.
            Not capped.
        discover_label_total:
          type: integer
          description: >-
            Distinct imported labels among those activities that are
            not already a category and still need a model call.
            Not capped. Rejected labels are not included.
        active_scan_run:
          allOf:
            - $ref: '#/components/schemas/CategoryScanRun'
          nullable: true
        month_cost_usd:
          type: number
          description: >-
            OpenRouter cost recorded this month. Each enrichment stores its
            own cost, so earlier months are not included.

    CategorySuggestionSettings:
      type: object
      required:
        - on_import_enabled
        - auto_enrich_enabled
        - fallback_models
        - max_evidence_items
        - deny_data_collection
      properties:
        on_import_enabled:
          type: boolean
        auto_enrich_enabled:
          type: boolean
        openrouter_model:
          type: string
          nullable: true
        default_openrouter_model:
          type: string
        fallback_models:
          type: array
          items:
            type: string
        max_evidence_items:
          type: integer
        deny_data_collection:
          type: boolean
        auto_assign_threshold:
          type: number
          nullable: true
          minimum: 0.5
          maximum: 1
          description: Null disables automatic reassignment. Default 0.9.
        monthly_cost_limit_usd:
          type: number
          minimum: 0.01
          maximum: 1000
          description: >-
            Category-check spend this month cannot start another run
            once it reaches this amount. Default 50.
        updated_by:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    CategorySuggestionSettingsUpdate:
      type: object
      properties:
        on_import_enabled:
          type: boolean
        auto_enrich_enabled:
          type: boolean
        openrouter_model:
          type: string
          nullable: true
        fallback_models:
          type: array
          maxItems: 3
          items:
            type: string
        max_evidence_items:
          type: integer
          minimum: 5
          maximum: 50
        deny_data_collection:
          type: boolean
        auto_assign_threshold:
          type: number
          nullable: true
          minimum: 0.5
          maximum: 1
        monthly_cost_limit_usd:
          type: number
          minimum: 0.01
          maximum: 1000

    CategoryScanRequest:
      type: object
      properties:
        org_id:
          type: string
          format: uuid
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 500
        batch_size:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        rescan:
          type: boolean
          default: false
        ignore_current_category:
          type: boolean
          default: false
          description: >
            Verify only. Omit the current category and untrusted
            descriptions, and offer only non-legacy leaves. A confirm
            verdict is counted as failed. A propose or reassign onto a
            legacy root or a parent group is counted as failed.
            Setting this flag forces rescan, so activities checked in
            the last 30 days are included. A missing
            description_source is treated like template.
            Discover rejects this flag.
        mode:
          type: string
          enum: [verify, discover]
          default: verify
          description: >
            verify checks the assigned category. discover groups the
            imported label, assigns an existing match, and asks the
            model only about labels that are not in the taxonomy.
            Omitted mode stays verify.
        review_scope:
          type: string
          enum: [pending_review, all]
          default: pending_review
          description: >
            pending_review limits the run to organizations still in
            review. all includes approved organizations. Omitted
            stays pending_review. Auto-assign still applies only
            while the organization is pending_review.

    CategoryScanRun:
      type: object
      required: [id, status, total_activities, batches_total, batches_done]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, done, failed]
        requested_by:
          type: string
          nullable: true
        org_id:
          type: string
          format: uuid
          nullable: true
        mode:
          type: string
          enum: [verify, discover]
        ignore_current_category:
          type: boolean
          description: >
            Verify run that classifies without trusting the current
            category. Discover runs stay false.
        batch_size:
          type: integer
        total_activities:
          type: integer
        batches_total:
          type: integer
