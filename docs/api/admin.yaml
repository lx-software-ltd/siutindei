          type: string
          format: uuid
    post:
      summary: Approve, map, or reject a category suggestion
      description: |
        Approve creates a category and moves linked activities that are
        still on Pending categorisation. Map and reject-with-target do
        the same reassignment and store an alias. Reject without a
        target leaves activities on the pending category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorySuggestionDecision'
      responses:
        "200":
          description: Updated suggestion
          content:
