  # --- Audit Logs (Admin Only, Read-Only) ---

  /v1/admin/audit-logs:
    get:
      summary: List audit logs
      description: |
        Query audit logs with optional filtering by table, record, user,
        action type, and timestamp. Returns paginated results.
      parameters:
        - name: table
          in: query
          required: false
          description: Filter by table name (required if record_id is provided)
          schema:
            type: string
        - name: record_id
          in: query
          required: false
          description: Filter by specific record ID (requires table parameter)
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: Filter by user who made the change
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Filter by action type
          schema:
            type: string
            enum: [INSERT, UPDATE, DELETE]
        - name: since
          in: query
          required: false
          description: Filter by timestamp (ISO 8601 format)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'

  /v1/admin/audit-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get audit log entry
      responses:
        "200":
          description: Audit log entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEntry'
        "404":
          description: Audit log entry not found

  # --- Partner API Key Management (Admin Group) ---

  /v1/admin/api-keys:
    get:
      summary: List partner API keys
      description: |
        Paginated list of partner API keys used to authenticate the
        `/v1/partner/*` endpoints (see `partner.yaml`). Only metadata is
        returned; plaintext key values are never stored.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of partner API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        "403":
          description: Not an admin
    post:
      summary: Create partner API key
      description: |
        Generate a new partner API key. The plaintext key value is
        returned only in this response and cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        "201":
          description: Created API key including the one-time plaintext value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "403":
          description: Not an admin

  /v1/admin/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get partner API key metadata
      responses:
        "200":
          description: API key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        "404":
          description: API key not found
    delete:
      summary: Revoke partner API key
      description: |
        Revoke a key (idempotent soft delete; the record is kept for the
        audit trail). Revoked keys stop working within the authorizer
        cache window (up to 5 minutes).
      responses:
        "200":
          description: The revoked API key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        "404":
          description: API key not found

