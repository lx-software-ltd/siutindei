openapi: 3.0.3
info:
  title: Admin CRUD API
  version: 0.1.0
  description: |
    CRUD endpoints for managing activities data.

    ## Validation Rules

    All endpoints enforce the following validation rules to ensure data integrity
    and protect against security vulnerabilities.

    ### String Length Limits
    | Field | Max Length |
    |-------|-----------|
    | name | 200 characters |
    | description | 5,000 characters |
    | email | 320 characters |
    | phone_country_code | 2 characters |
    | phone_number | 20 characters |
    | social handles / URLs | 64 (handles) / 2,048 (URLs) |
    | address | 500 characters |
    | media_urls (each) | 2,048 characters |
    | logo_media_url | 2,048 characters |

    ### Array Limits
    | Field | Max Items |
    |-------|----------|
    | media_urls | 20 |
    | languages | 20 |

    ### Numeric Ranges
    | Field | Range |
    |-------|-------|
    | lat | -90 to 90 |
    | lng | -180 to 180 |
    | age_min | 0 to 119 |
    | age_max | 1 to 120 |
    | amount | >= 0 |
    | sessions_count | > 0 |
    | day_of_week_utc | 0-6 (Sunday-Saturday) |
    | start_minutes_utc | 0-1439 |
    | end_minutes_utc | 0-1439 |

    ### Allowed Values
    | Field | Allowed Values |
    |-------|---------------|
    | currency | Any ISO 4217 3-letter code (default HKD, case-insensitive) |
    | languages | en, zh, ja, ko, fr, de, es, pt, it, ru, ar, hi, th, vi, id, ms, tl, nl, pl, tr, yue (Cantonese, ISO 639-3) |
    | pricing_type | per_class, per_sessions, per_hour, per_day, free |
    | schedule_type | weekly |

    ### Contact Validation
    - phone_country_code must be an ISO 3166-1 alpha-2 country code.
    - phone_number must be valid for the selected phone_country_code.
    - email must be a valid email address.
    - social fields accept either an http/https URL or a handle.

paths:
  /v1/admin/organizations:
    get:
      summary: List organizations
      description: Retrieve a paginated list of organizations.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (1-200, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: place_id
          in: query
          required: false
          description: Look up an organization by Google place_id.
          schema:
            type: string
            maxLength: 255
        - name: source_id
          in: query
          required: false
          description: |
            Look up an organization by its stored catalog source_id.
            Import sets it from `source_id` or from `sourceId=` in
            `vetting_note`.
          schema:
            type: string
        - name: org_id
          in: query
          required: false
          description: Limit the list to one organization.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Case-insensitive name search.
          schema:
            type: string
        - name: review_status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_review, approved, rejected]
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Listing status filter.
          schema:
            type: string
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
    post:
      summary: Create organization
      description: Create a new organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/admin/organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get organization
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "404":
          description: Organization not found
    put:
      summary: Update organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "400":
          description: Validation error
        "404":
          description: Organization not found
    patch:
      summary: Patch organization listing fields
      description: |
        Partial update used by the owner UI to set `status` (with optional
        `reason`) or attach a Google `place_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "400":
          description: Validation error
        "404":
          description: Organization not found
    delete:
      summary: Delete organization
      responses:
        "204":
          description: Organization deleted
        "404":
          description: Organization not found

  /v1/admin/organizations/{id}/media:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create organization media upload URL
      description: Generate a presigned URL for uploading organization media.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        "400":
          description: Validation error
    delete:
      summary: Delete organization media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaDeleteRequest'
      responses:
        "204":
          description: Media deleted

  /v1/admin/imports/presign:
    post:
      summary: Create admin import upload URL
      description: |
        Generate a presigned URL for uploading a JSON import file to S3.
        Requires a Cognito JWT in the `admin` or `importer` group.
      security:
        - AdminGroupAuth: []
        - ImporterGroupAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImportPresignRequest'
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportPresignResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/admin/imports:
    get:
      summary: List import jobs
      description: |
        Newest-first cursor page of stored import jobs. Admin only.
        Per-row results stay on `GET /v1/admin/imports/{job_id}`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Import job page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportJobList'
    post:
      summary: Process admin import
      description: |
        Process a JSON import file previously uploaded to S3. The import supports
        partial success and returns per-record warnings and errors.
        Requires a Cognito JWT in the `admin` or `importer` group.
        `GET /v1/admin/imports/export` remains admin-only.
        Importer-only callers skip an existing organization when the
        payload `manager_id` matches (case-insensitive); existing
        venues, activities, pricing, and schedules are skipped and
        missing ones are created. Existing rows are skipped before
        `area_name` / `category_name` resolution. After each activity
        upsert the single venue from this import's `locations[]` (or
        the expanded flat location) is attached on `activity_locations`.
        Import does not look up other venues already on the org;
        Alembic `0031_link_orphan_activities` backfills historical
        orphans when an org has exactly one location. A skipped
        activity that gains a join reports warning
        `linked existing activity to imported venue`. A foreign name
        match still fails that record with `exists` and skips children.
        Admin imports may update an organization whose current manager_id
        matches the payload; `manager_id` is never changed on update.
        When `dry_run` is true the file is validated the same way as a live
        import (presign → PUT → POST) but no rows or audit entries are
        committed.
      security:
        - AdminGroupAuth: []
        - ImporterGroupAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImportRequest'
      responses:
        "200":
          description: Import processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/admin/imports/{job_id}:
    get:
      summary: Get a stored import job
      description: |
        Return the stored summary and per-row results for a previous
        `object_key` so the owner can reopen an import from the Progress
        card. Admin-only.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stored import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportJob'
        "404":
          description: Import job not found

  /v1/admin/imports/export:
    get:
      summary: Export admin data
      description: |
        Generate a presigned download URL for an export JSON file. The exported
        JSON is compatible with the admin import schema. Schedule entries are
        emitted in UTC. `review_status` is omitted. `review_notes` is included
        for visibility and ignored on import.
      parameters:
        - name: org_name
          in: query
          required: false
          description: Optional organization name to export a single organization.
          schema:
            type: string
      responses:
        "200":
          description: Export download URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExportResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/admin/org-review:
    get:
      summary: List organizations for review
      description: |
        Cursor page of organizations with completeness issues, ordered by
        name then id unless `sort=last_imported_at`. The cursor carries the
        sort key. Blocker filters run in SQL. Warning issue codes are
        matched after the SQL filters. Public search hides
        rows that are not `approved` only when `ORG_REVIEW_GATE_ENABLED`
        is true. After a release, CloudFront may serve the previous
        search response for up to 5 minutes.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque cursor for the active sort.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, last_imported_at]
            default: name
        - name: review_status
          in: query
          schema:
            type: string
            enum: [pending_review, approved, rejected]
        - name: status
          in: query
          schema:
            type: string
            enum: [operational, closed_temporarily, closed_permanently, hidden]
        - name: source
          in: query
          schema:
            type: string
        - name: import_job_id
          in: query
          schema:
            type: string
            format: uuid
        - name: issue
          in: query
          schema:
            type: string
        - name: has_blockers
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Review queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgReviewList'
    post:
      summary: Bulk review action
      description: |
        `POST /v1/admin/org-review/bulk`. Apply one action to up to 200
        organizations. `set_fields` writes only the supplied whitelist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgReviewBulkRequest'
      responses:
        "200":
          description: Per-organization results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgReviewBulkResponse'

  /v1/admin/org-review/summary:
    get:
      summary: Review queue counts
      description: |
        Aggregated in SQL. `by_issue` counts organizations once per issue
        code, including warnings.
      responses:
        "200":
          description: Counts by review state, source, and issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgReviewSummary'

  /v1/admin/org-review/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Organization review detail
      responses:
        "200":
          description: Organization, children, and issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgReviewDetail'
        "404":
          description: Organization not found

  /v1/admin/org-review/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Approve, reject, or reopen one organization
      description: |
        Approve returns 400 with `issues` when blockers remain unless
        `force` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgReviewDecisionRequest'
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "400":
          description: Blocked or invalid
        "404":
          description: Organization not found

  /v1/admin/org-duplicates:
    get:
      summary: List likely duplicate organizations
      description: |
        Groups organizations that share a normalized name, contact, source id,
        website host, or a pg_trgm name similarity at or above `min_score`
        (default 0.6). Pairs an admin dismissed are kept apart. Admin only.
        Merge is `POST /v1/admin/org-duplicates/merge`. Data-quality routes
        share `/v1/admin/{proxy+}` so the stack stays under the
        CloudFormation resource cap.
      parameters:
        - name: min_score
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: signal
          in: query
          schema:
            type: string
            enum: [name, source_id, phone, email, social, website, translation, location]
        - name: source
          in: query
          schema:
            type: string
        - name: review_status
          in: query
          schema:
            type: string
            enum: [pending_review, approved, rejected]
        - name: q
          in: query
          schema:
            type: string
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Duplicate groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDuplicateListResponse'
        "403":
          description: Admin group required

  /v1/admin/org-duplicates/search:
    get:
      summary: Search organizations to merge
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching organizations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgDuplicateMember'

  /v1/admin/org-duplicates/dismiss:
    post:
      summary: Mark organizations as not duplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_ids]
              properties:
                org_ids:
                  type: array
                  minItems: 2
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Pairs stored
          content:
            application/json:
              schema:
                type: object
                required: [dismissed_pairs]
                properties:
                  dismissed_pairs:
                    type: integer

  /v1/admin/org-duplicates/merge:
    post:
      summary: Merge organizations into one survivor
      description: |
        Fills blank survivor fields from the sources. `field_overrides`
        replaces a field with the given value. `dry_run` returns the same
        preview without writing. Children move onto the survivor.
        Locations that share an address, and activities that share a
        name, are combined. Each source's `source_id` and `place_id` are
        stored on `organization_merges` so a later import resolves to
        the survivor. The survivor's own values win unless overridden.
        Copied media objects are deleted only after the merge commits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMergeRequest'
      responses:
        "200":
          description: Dry-run preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMergeResult'
        "201":
          description: Organizations merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMergeResult'

  /v1/admin/org-duplicates/{id}:
    get:
      summary: Load one duplicate group
      description: |
        `id` is the comma-separated organization ids from the list.
        The group is returned when those organizations still exist,
        including when they are not on the current list page.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Duplicate group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDuplicateGroup'
        "404":
          description: Fewer than two of the organizations exist

  /v1/admin/name-fixes:
    get:
      summary: List name cleanup proposals
      description: |
        Pending rows come from `POST /v1/admin/name-fixes/scan` and from
        names the import cleaner would change. Scan uses `review_scope`
        (`pending_review` or `all`).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, applied, dismissed]
            default: pending
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [organization, activity]
        - name: rule
          in: query
          schema:
            type: string
            enum:
              - html_entities
              - nfkc
              - whitespace
              - trailing_punctuation
              - cjk_spacing
              - title_case
              - brackets
              - split_bilingual
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixListResponse'

  /v1/admin/name-fixes/summary:
    get:
      summary: Count name-fix proposals
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixSummary'

  /v1/admin/name-fixes/settings:
    get:
      summary: Read name cleanup rules
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixSettings'
    put:
      summary: Replace name cleanup rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameFixSettings'
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixSettings'

  /v1/admin/name-fixes/settings/preview:
    post:
      summary: Preview cleanup for one name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                name_translations:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Cleaned name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixPreview'

  /v1/admin/name-fixes/scan:
    post:
      summary: Sweep names and store proposals
      description: |
        Re-evaluates every name in `review_scope` and deletes pending
        rows the current rules no longer change. `pending_review`
        limits organizations and their activities to that review status.
        `all` includes every organization and activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_scope]
              properties:
                entity_type:
                  type: string
                  enum: [organization, activity]
                org_id:
                  type: string
                  format: uuid
                q:
                  type: string
                review_scope:
                  type: string
                  enum: [pending_review, all]
      responses:
        "200":
          description: Scan counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixScanResult'

  /v1/admin/name-fixes/bulk:
    post:
      summary: Apply or dismiss name proposals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameFixBulkRequest'
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixBulkResult'

  /v1/admin/name-fixes/{id}:
    get:
      summary: Load one name proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixProposal'
        "404":
          description: Proposal not found
    post:
      summary: Apply or dismiss one name proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [apply, dismiss]
                value:
                  type: string
                  description: Replacement name. Defaults to the proposal.
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameFixProposal'
        "400":
          description: The name matches another organization

  /v1/admin/location-fixes:
    get:
      summary: List venue proposals
      description: |
        Pending rows come from `POST /v1/admin/location-fixes/scan`.
        Rules that can decide a venue write a proposal immediately.
        A single venue on the organization is linked during the sweep.
        Everything else waits for the model, which runs on the category
        suggestion queue.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, applied, dismissed]
            default: pending
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [organization, activity, location]
        - name: kind
          in: query
          schema:
            type: string
            enum: [link_existing, create_location, unresolved, update_location]
        - name: source
          in: query
          schema:
            type: string
            enum:
              - rule:single_location
              - rule:pricing_schedule
              - rule:name_area
              - rule:no_venue
              - model
              - rule:missing_coordinates
              - rule:empty_address
              - rule:pin_outside_area
              - rule:open_data
              - lookup:nominatim
              - lookup:google
        - name: grade
          in: query
          schema:
            type: string
            enum: [precise, street, coarse, miss, manual, not_looked_up]
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
