      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationFixSettings'
    put:
      summary: Replace the location-sweep monthly budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationFixSettings'
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationFixSettings'

  /v1/admin/location-fixes/scan:
    post:
      summary: Sweep venues and store proposals
      description: |
        Applies venue rules for `review_scope` (`pending_review` or
        `all`). An organization with one location is linked immediately.
        Rows the rules cannot decide are queued for the model. Existing
        locations are checked for an empty address, a missing pin, and a
        pin outside its Hong Kong district. One
        location sweep runs at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_scope]
              properties:
                entity_type:
                  type: string
                  enum: [organization, activity, location]
                org_id:
                  type: string
                  format: uuid
                q:
                  type: string
                review_scope:
                  type: string
                  enum: [pending_review, all]
                lookup:
                  type: string
                  enum: [nominatim, google]
                  description: |
                    Queue a pin lookup for pending missing-coordinate
                    venues. `google` is rejected when the Places key is empty.
      responses:
        "200":
          description: Sweep counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationFixScanResult'
        "409":
          description: A location sweep is already running
        "502":
          description: The model batches could not be queued

  /v1/admin/location-fixes/bulk:
    post:
      summary: Apply or dismiss venue proposals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationFixBulkRequest'
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationFixBulkResult'

