                $ref: '#/components/schemas/LocationFixProposal'
        "404":
          description: Proposal not found
    post:
      summary: Apply or dismiss one venue proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [apply, dismiss]
                address:
                  type: string
                area_id:
                  type: string
                  format: uuid
                target_location_id:
                  type: string
                  format: uuid
                  description: One candidate venue when the proposal is unresolved.
                lat:
                  type: number
                  description: Manual pin latitude. Send with lng.
                lng:
                  type: number
                  description: Manual pin longitude. Send with lat.
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationFixProposal'
        "404":
          description: Proposal not found

