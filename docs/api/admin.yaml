    # Pricing schemas
    PricingCreate:
      type: object
      required:
        - activity_id
        - location_id
        - pricing_type
        - amount
      properties:
        activity_id:
          type: string
          format: uuid
          description: Activity UUID (required)
        location_id:
          type: string
          format: uuid
          description: Location UUID (required)
        pricing_type:
          type: string
          enum: [per_class, per_sessions, per_hour, per_day, free]
          description: |
            Pricing type (required):
            - per_class: Price per individual class
            - per_sessions: Per term pricing (requires sessions_count)
            - per_hour: Hourly price
            - per_day: Daily price
            - free: Free pricing
        amount:
          type: number
          minimum: 0
          description: Price amount (required, must be >= 0)
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
          default: HKD
          description: ISO 4217 currency code (default HKD, case-insensitive)
        sessions_count:
          type: integer
          minimum: 1
          description: Classes within term (required for per_sessions, must be > 0)
        free_trial_class_offered:
          type: boolean
          description: Whether a free trial class is offered
          default: false

