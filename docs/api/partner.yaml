openapi: 3.0.3
info:
  title: Partner API
  version: 0.1.0
  description: |
    Public partner APIs for querying and editing activities data,
    authenticated with custom API keys.

    ## Authentication

    Every request must include an `x-partner-key` header with a key issued
    by an administrator (`POST /v1/admin/api-keys`, see `admin.yaml`).
    Keys are validated by a dedicated API Gateway Lambda authorizer against
    SHA-256 hashes stored in the `api_keys` table. Revoked or expired keys
    are rejected (authorizer results are cached for up to 5 minutes).

    ## Scopes

    | Scope | Allowed methods |
    |-------|-----------------|
    | read  | `GET` only (search + list/detail of all resources) |
    | crud  | `GET`, `POST`, `PUT`, `DELETE` |

    ## Organization scoping

    Keys are either **full access** (no organization) or **scoped to one
    organization**:
    - Search and list results are filtered to the key's organization.
    - Detail, update, and delete of resources belonging to another
      organization return `403`.
    - Org-scoped keys cannot create organizations (`POST
      /v1/partner/organizations` returns `403`) and cannot change the
      organization manager.
    - A full-access key lists every organization (`pending_review`,
      `approved`, and `rejected`) and can read pending name-cleanup
      proposals (`GET /v1/partner/name-fixes`), venue proposals
      (`GET /v1/partner/location-fixes`), and category-check
      reviews (`GET /v1/partner/category-reviews`). A full-access `crud`
      key can also decide those reviews (`POST
      /v1/partner/category-reviews/{id}` and `POST
      /v1/partner/category-reviews/bulk`), decide venue proposals
      (`POST /v1/partner/location-fixes/{id}` and `POST
      /v1/partner/location-fixes/bulk`), and list or delete activity
      categories (`GET` / `DELETE /v1/partner/activity-categories`).
      Organization-scoped keys receive `403` on those write and
      category routes. Organization list
      and detail responses include `pending_name_fixes` with the record
      type, current name, proposed name, and rules, and
      `pending_location_fixes` for that organization and its activities.
      Activity list and detail responses include `category_review` for
      the latest check on that activity (`null` when none exists),
      `location_ids`, and `pending_location_fix` (`null` when none).

    ## Validation rules

    Request bodies use the same schemas and validation rules as the admin
    CRUD API; see `admin.yaml` for field limits and allowed values.

security:
  - PartnerKeyAuth: []

paths:
  /v1/partner/activities/search:
    get:
      summary: Search activities
      description: |
        Search for activities matching the specified filters. Same filter
        semantics as the public `GET /v1/activities/search` endpoint
        (see `search.yaml`), but authenticated with a partner API key
        instead of the mobile API key + device attestation.
        Results are paginated and ordered by schedule time. Org-scoped
        keys only receive activities of their organization.
      parameters:
        - name: age
          in: query
          required: false
          description: Filter activities suitable for this age (>= 0)
          schema:
            type: integer
            minimum: 0
        - name: area_id
          in: query
          required: false
          description: |
            Filter by geographic area UUID. Matches activities in the given
            area or any descendant area.
          schema:
            type: string
            format: uuid
        - name: activity_id
          in: query
          required: false
          description: Return results for a single activity UUID.
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: false
          description: Filter by activity category UUID (repeatable).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: pricing_type
          in: query
          required: false
          schema:
            type: string
            enum: [per_class, per_sessions, per_hour, per_day, free]
        - name: price_min
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: price_max
          in: query
          required: false
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: schedule_type
          in: query
          required: false
          schema:
            type: string
            enum: [weekly]
        - name: day_of_week_utc
          in: query
          required: false
          description: Day of week (0=Sunday, 6=Saturday).
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: start_minutes_utc
          in: query
          required: false
          description: Start time in minutes from midnight UTC (0-1439).
          schema:
            type: integer
            minimum: 0
            maximum: 1439
        - name: end_minutes_utc
          in: query
          required: false
          description: End time in minutes from midnight UTC (0-1439).
          schema:
            type: integer
            minimum: 0
            maximum: 1439
        - name: language
          in: query
          required: false
          description: Filter by language codes (repeatable).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          required: false
          description: Maximum results per page (1-200, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from previous response
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "./search.yaml#/components/schemas/ActivitySearchResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing, invalid, revoked, or expired API key

  /v1/partner/name-fixes:
    get:
      summary: List pending name cleanup proposals
      description: |
        Pending proposed names for organizations and activities, with
        the record type (`entity_type`) and the rules that produced
        each proposal. A full-access key sees every pending proposal.
        An org-scoped key sees only that organization's records.
        `review_status` is the owning organization's review status.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [organization, activity]
        - name: rule
          in: query
          schema:
            type: string
            enum:
              - html_entities
              - nfkc
              - whitespace
              - trailing_punctuation
              - cjk_spacing
              - title_case
              - brackets
              - split_bilingual
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pending name proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerNameFixListResponse"
        "403":
          description: Invalid API key

  /v1/partner/location-fixes:
    get:
      summary: List venue proposals
      description: |
        Pending venue links and new-location proposals. A full-access
        key sees every proposal. An org-scoped key sees only that
        organization's records.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, applied, dismissed]
            default: pending
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [organization, activity]
        - name: kind
          in: query
          schema:
            type: string
            enum: [link_existing, create_location, unresolved]
        - name: source
          in: query
          schema:
            type: string
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Venue proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLocationFixListResponse"
        "403":
          description: Invalid API key

  /v1/partner/location-fixes/bulk:
    post:
      summary: Apply or dismiss matching venue proposals
      description: Full-access `crud` keys only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/LocationFixBulkRequest"
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/LocationFixBulkResult"
        "403":
          description: Read-only key or organization-scoped key

  /v1/partner/location-fixes/{id}:
    post:
      summary: Apply or dismiss one venue proposal
      description: Full-access `crud` keys only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [apply, dismiss]
                address:
                  type: string
                area_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerLocationFix"
        "403":
          description: Read-only key or organization-scoped key
        "404":
          description: Proposal not found

  /v1/partner/category-reviews:
    get:
      summary: List category-check reviews
      description: |
        Category-check reviews for activities, including confirmed
        assignments and pending suggestions. `status` is the review
        decision (`confirmed`, `pending`, `auto_applied`, `applied`,
        `dismissed`, or `reverted`). `verdict` is `confirm`,
        `reassign`, or `propose`. A pending `propose` is a suggested
        new leaf; a pending `reassign` is a suggested existing leaf.
        A full-access key sees every review. An org-scoped key sees
        only that organization's reviews. Optional `org_id` limits a
        full-access key to one organization.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
            enum:
              [confirmed, pending, auto_applied, applied, dismissed, reverted]
        - name: verdict
          in: query
          schema:
            type: string
            enum: [confirm, reassign, propose]
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: proposed_category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Category-check reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCategoryReviewListResponse"
        "403":
          description: Invalid API key

  /v1/partner/category-reviews/bulk:
    post:
      summary: Apply or dismiss matching pending reviews
      description: |
        Full-access `crud` keys only. Same body and paging as
        `POST /v1/admin/category-suggestions/reviews/bulk`.
        Organization-scoped keys receive `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/CategoryReviewBulkRequest"
      responses:
        "200":
          description: Page of bulk decisions
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/CategoryReviewBulkResponse"
        "400":
          description: Invalid bulk request
        "403":
          description: Read-only key or organization-scoped key

  /v1/partner/category-reviews/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Apply, dismiss, or revert one category-check review
      description: |
        Full-access `crud` keys only. Same body as
        `POST /v1/admin/category-suggestions/reviews/{id}`.
        Organization-scoped keys receive `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/ActivityCategoryReviewDecision"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerCategoryReview"
        "400":
          description: Invalid decision
        "403":
          description: Read-only key or organization-scoped key
        "404":
          description: Review not found

  /v1/partner/activity-categories:
    get:
      summary: List the activity category tree
      description: |
        Full-access keys only. Returns the nested tree, including
        empty leftover categories. Organization-scoped keys receive
        `403`.
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/ActivityCategoryTreeResponse"
        "403":
          description: Organization-scoped key

  /v1/partner/activity-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get one activity category
      description: Full-access keys only.
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/ActivityCategory"
        "403":
          description: Organization-scoped key
        "404":
          description: Not found
    delete:
      summary: Delete an empty activity category
      description: |
        Full-access `crud` keys only. Refused when the category is
        Pending categorisation, appears in the home wizard, has
        children, or is assigned to an activity.
      responses:
        "204":
          description: Deleted
        "400":
          description: Category cannot be deleted
        "403":
          description: Read-only key or organization-scoped key
        "404":
          description: Not found

  /v1/partner/organizations:
    get:
      summary: List organizations
      description: |
        Paginated list. A full-access key receives every organization
        (`pending_review`, `approved`, and `rejected`). Org-scoped keys
        only receive their organization. Each item includes
        `pending_name_fixes` and `pending_location_fixes` for that
        organization and its activities.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: review_status
          in: query
          schema:
            type: string
            enum: [pending_review, approved, rejected]
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerOrganizationListResponse"
        "403":
          description: Invalid API key
    post:
      summary: Create organization
      description: |
        Requires a full-access `crud` key. Org-scoped keys receive `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/OrganizationCreate"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Organization"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or org-scoped key

  /v1/partner/organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerOrganization"
        "403":
          description: Invalid key or resource outside the key's organization
        "404":
          description: Not found
    put:
      summary: Update organization
      description: |
        Requires a `crud` key. Org-scoped keys can only update their own
        organization and cannot change `manager_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Organization"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found
    delete:
      summary: Delete organization
      description: |
        Requires a `crud` key. Org-scoped keys can only delete their own
        organization.
      responses:
        "204":
          description: Deleted
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found

  /v1/partner/locations:
    get:
      summary: List locations
      description: |
        Paginated list. Org-scoped keys only receive locations of their
        organization.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/LocationListResponse"
        "403":
          description: Invalid API key
    post:
      summary: Create location
      description: |
        Requires a `crud` key. Org-scoped keys can only create locations
        for their organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/LocationCreate"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Location"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope org_id

  /v1/partner/locations/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get location
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Location"
        "403":
          description: Invalid key or resource outside the key's organization
        "404":
          description: Not found
    put:
      summary: Update location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Location"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found
    delete:
      summary: Delete location
      responses:
        "204":
          description: Deleted
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found

  /v1/partner/activities:
    get:
      summary: List activities
      description: |
        Paginated list. Org-scoped keys only receive activities of their
        organization. Each item includes `category_review` for the
        latest category check (`null` when the activity has not been
        checked), `location_ids`, and `pending_location_fix` (`null`
        when none).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerActivityListResponse"
        "403":
          description: Invalid API key
    post:
      summary: Create activity
      description: |
        Requires a `crud` key. Org-scoped keys can only create activities
        for their organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Activity"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope org_id

  /v1/partner/activities/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get activity
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerActivity"
        "403":
          description: Invalid key or resource outside the key's organization
        "404":
          description: Not found
    put:
      summary: Update activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Activity"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found
    delete:
      summary: Delete activity
      responses:
        "204":
          description: Deleted
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found

  /v1/partner/pricing:
    get:
      summary: List pricing entries
      description: |
        Paginated list. Org-scoped keys only receive pricing of their
        organization's activities.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Pricing entries
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/PricingListResponse"
        "403":
          description: Invalid API key
    post:
      summary: Create pricing entry
      description: |
        Requires a `crud` key. Org-scoped keys can only create pricing for
        their organization's activities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/PricingCreate"
      responses:
        "201":
          description: Created pricing entry
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Pricing"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope activity

  /v1/partner/pricing/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get pricing entry
      responses:
        "200":
          description: Pricing entry
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Pricing"
        "403":
          description: Invalid key or resource outside the key's organization
        "404":
          description: Not found
    put:
      summary: Update pricing entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/PricingUpdate"
      responses:
        "200":
          description: Updated pricing entry
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Pricing"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found
    delete:
      summary: Delete pricing entry
      responses:
        "204":
          description: Deleted
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found

  /v1/partner/schedules:
    get:
      summary: List schedules
      description: |
        Paginated list. Org-scoped keys only receive schedules of their
        organization's activities.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/ScheduleListResponse"
        "403":
          description: Invalid API key
    post:
      summary: Create schedule
      description: |
        Requires a `crud` key. Org-scoped keys can only create schedules
        for their organization's activities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Schedule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope activity

  /v1/partner/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get schedule
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Schedule"
        "403":
          description: Invalid key or resource outside the key's organization
        "404":
          description: Not found
    put:
      summary: Update schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./admin.yaml#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "./admin.yaml#/components/schemas/Schedule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found
    delete:
      summary: Delete schedule
      responses:
        "204":
          description: Deleted
        "403":
          description: Invalid key, read-only key, or out-of-scope resource
        "404":
          description: Not found

components:
  securitySchemes:
    PartnerKeyAuth:
      type: apiKey
      in: header
      name: x-partner-key
      description: |
        Partner API key issued by an administrator. Format:
        `stk_<43 urlsafe characters>`. Only a SHA-256 hash is stored
        server-side.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (1-200, default 50)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Pagination cursor from previous response
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
    PartnerNameFix:
      type: object
      required:
        [id, entity_type, entity_id, current_value, proposed_value, rules]
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [organization, activity]
        entity_id:
          type: string
          format: uuid
        current_value:
          type: string
        proposed_value:
          type: string
        rules:
          type: array
          items:
            type: string
        review_status:
          type: string
          enum: [pending_review, approved, rejected]
          nullable: true
    PartnerLocationFix:
      type: object
      required: [id, entity_type, entity_id, org_id, kind, source, status]
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [organization, activity]
        entity_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [link_existing, create_location, unresolved]
        target_location_id:
          type: string
          format: uuid
          nullable: true
        proposed_location:
          type: object
          nullable: true
          additionalProperties: true
        source:
          type: string
        confidence:
          type: number
          nullable: true
        rationale:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, applied, dismissed]
    PartnerLocationFixListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerLocationFix"
        next_cursor:
          type: string
          nullable: true
    PartnerNameFixListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerNameFix"
        next_cursor:
          type: string
          nullable: true
    PartnerOrganization:
      allOf:
        - $ref: "./admin.yaml#/components/schemas/Organization"
        - type: object
          properties:
            pending_name_fixes:
              type: array
              items:
                $ref: "#/components/schemas/PartnerNameFix"
            pending_location_fixes:
              type: array
              items:
                $ref: "#/components/schemas/PartnerLocationFix"
    PartnerCategoryReview:
      type: object
      required:
        [
          id,
          activity_id,
          activity_name,
          org_id,
          org_name,
          verdict,
          status,
        ]
      properties:
        id:
          type: string
          format: uuid
        activity_id:
          type: string
          format: uuid
        activity_name:
          type: string
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        current_category_id:
          type: string
          format: uuid
          nullable: true
        current_category_name:
          type: string
          nullable: true
        verdict:
          type: string
          enum: [confirm, reassign, propose]
        proposed_category_id:
          type: string
          format: uuid
          nullable: true
        proposed_category_name:
          type: string
          nullable: true
          description: >
            Existing leaf name for a reassign, or the suggested new
            leaf name for a propose.
        suggestion_id:
          type: string
          format: uuid
          nullable: true
        confidence:
          type: number
          nullable: true
        status:
          type: string
          enum: [confirmed, pending, auto_applied, applied, dismissed, reverted]
        created_at:
          type: string
          format: date-time
          nullable: true
    PartnerCategoryReviewListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerCategoryReview"
        next_cursor:
          type: string
          nullable: true
    PartnerActivity:
      allOf:
        - $ref: "./admin.yaml#/components/schemas/Activity"
        - type: object
          properties:
            category_review:
              allOf:
                - $ref: "#/components/schemas/PartnerCategoryReview"
              nullable: true
            location_ids:
              type: array
              items:
                type: string
                format: uuid
            pending_location_fix:
              allOf:
                - $ref: "#/components/schemas/PartnerLocationFix"
              nullable: true
    PartnerActivityListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerActivity"
        next_cursor:
          type: string
          nullable: true
    PartnerOrganizationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartnerOrganization"
        next_cursor:
          type: string
          nullable: true
