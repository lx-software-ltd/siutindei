<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none">
  <ellipse cx="32" cy="76" rx="10" ry="3" fill="#2E1D12" opacity="0.2"/>
  <path d="M32 76 C32 76 8 50 8 30 A24 24 0 0 1 56 30 C56 50 32 76 32 76 Z" fill="#FFFFFF" stroke="#2E1D12" stroke-width="2.5"/>
  <g transform="translate(0.8 -1.2) scale(0.65)"><!-- Ground shadow -->
  <!-- Toy box interior -->
  <polygon
    points="48,11 79.2,29 48,47 16.8,29"
    fill="#57402E"
    stroke="#2E1D12"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Balls inside -->
  <circle cx="40" cy="24" r="9" fill="#F5C51B" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="36.8" cy="20.8" r="2.6" fill="#FFDE64" />
  <circle cx="57" cy="26" r="8" fill="#F2A0BF" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="54.2" cy="23.2" r="2.2" fill="#FFF7E6" />
  <circle cx="48" cy="16" r="6.5" fill="#8BC152" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="45.8" cy="13.8" r="2" fill="#A5D273" />
  <!-- Box walls (earth teal) -->
  <g stroke="#2E1D12" stroke-width="4" stroke-linejoin="round">
    <polygon points="16.8,29 48,47 48,71 16.8,53" fill="#A6DCD3" />
    <polygon points="48,47 79.2,29 79.2,53 48,71" fill="#7CC4B9" />
  </g>
  <!-- Heart on the front face -->
  <path
    d="M30 44 C28 41.6 24.4 42.4 24.4 45.4 C24.4 48 27.6 50.4 30 52.6 C32.4 50.4 35.6 48 35.6 45.4 C35.6 42.4 32 41.6 30 44 Z"
    fill="#F2A0BF"
    stroke="#2E1D12"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Ball outside the box -->
  <circle cx="14" cy="59" r="6" fill="#F5C51B" stroke="#2E1D12" stroke-width="3" />
  <circle cx="12" cy="57" r="1.8" fill="#FFDE64" /></g>
</svg>
