<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5c51b" />
    <title>Siu Tin Dei &mdash; Coming soon</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="shell">
      <main class="page">
        <section class="hero" aria-label="Siu Tin Dei coming soon">
          <div class="hero__stars" aria-hidden="true"></div>
          __MAINTENANCE_BUBBLES__
          <div class="hero__content" id="content">
            <img
              class="hero__logo"
              src="/images/brand/siutindei-logo-stacked.svg"
              alt="Siu Tin Dei"
              width="175"
              height="150"
            />
            <h1 class="brand-title">
              Every child deserves their own small world
            </h1>
            <p class="hero__subtitle">
              Siu Tin Dei is launching soon &mdash; trusted classes, workshops
              and outdoor adventures across Hong Kong, checked by local
              parents.
            </p>
            <div class="card">
              <p>
                For updates or urgent requests, email
                <a href="mailto:__NEXT_PUBLIC_EMAIL__">__NEXT_PUBLIC_EMAIL__</a>.
              </p>
              <ul class="contact-icons">
                <li>
                  <a class="contact-icon" href="mailto:__NEXT_PUBLIC_EMAIL__">
                    <img
                      src="/images/contact/email.svg"
                      alt="Email"
                      width="72"
                      height="72"
                    />
                  </a>
                </li>
                <li>
                  <a
                    class="contact-icon"
                    href="__NEXT_PUBLIC_WHATSAPP_URL__"
                    target="_blank"
                    rel="noreferrer noopener"
                  >
                    <img
                      src="/images/contact/whatsapp.svg"
                      alt="WhatsApp"
                      width="72"
                      height="72"
                    />
                  </a>
                </li>
                <li>
                  <a
                    class="contact-icon"
                    href="__NEXT_PUBLIC_INSTAGRAM_URL__"
                    target="_blank"
                    rel="noreferrer noopener"
                  >
                    <img
                      src="/images/contact/instagram.svg"
                      alt="Instagram"
                      width="72"
                      height="72"
                    />
                  </a>
                </li>
                <li>
                  <a
                    class="contact-icon"
                    href="__NEXT_PUBLIC_FACEBOOK_URL__"
                    target="_blank"
                    rel="noreferrer noopener"
                  >
                    <img
                      src="/images/contact/facebook.svg"
                      alt="Facebook"
                      width="72"
                      height="72"
                    />
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </section>
      </main>
      __MAINTENANCE_FOOTER__
    </div>
  </body>
</html>
